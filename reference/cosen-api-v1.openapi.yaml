          example: m1
          description: 商品编码（m1/h1/f1/c1…）
        qty:
          type: integer
          minimum: 1
          maximum: 99
          example: 1
          description: 数量，1..99
        spec:
          type: object
          maxProperties: 8
          additionalProperties:
            type: string
          description: 规格选择，如 {"size":"大杯","temp":"少冰","sugar":"少甜","milk":"鲜牛奶"}
      required:
      - productCode
      - qty
    CreateOrderReq:
      type: object
      title: CreateOrderReq
      properties:
        items:
          type: array
          minItems: 1
          maxItems: 50
          description: 商品明细，1..50 项
          items:
            $ref: '#/components/schemas/CreateOrderItemReq'
        couponId:
          type: string
          maxLength: 40
          description: 可选：使用的用户券 couponNo，需属于本人且 unused
        payMode:
          type: string
          enum:
          - balance
          - wechat
          - mixed
          default: wechat
          description: 支付方式，默认 wechat
        remark:
          type: string
          maxLength: 255
          description: 备注
        idempotencyKey:
          type: string
          minLength: 8
          maxLength: 64
          description: 下单幂等键，与 Header Idempotency-Key 二选一必填；缺失/非法返回 40007
        tableNo:
          type:
          - string
          - 'null'
          maxLength: 32
          description: 可选桌号，trim 后空串按未选择；非空时必须匹配 [A-Z0-9_-]{1,24} 且为已启用桌位，否则 40002。
      required:
      - items
    PayOrderReq:
      type: object
      title: PayOrderReq
      properties:
        payMode:
          type: string
          enum:
          - balance
          - wechat
          - mixed
          description: 支付方式；mixed 时两个金额列均须 > 0
        balancePayCent:
          type: integer
          format: int64
          minimum: 0
          description: 储值支付（分）；mixed 时必须 > 0
        wechatPayCent:
          type: integer
          format: int64
          minimum: 0
          description: 微信支付（分）；mixed 时必须 > 0
      required:
      - payMode
    OrderDetail:
      type: object
      title: OrderDetail
      description: 订单 + 明细（显式展开字段，便于 Apifox/代码生成；不含 memberId/version/idempotencyKey）
      properties:
        id:
          type: string
          format: int64
          readOnly: true
          description: 订单ID（bigint ID，JSON 用字符串避免精度丢失）
        orderNo:
          type: string
          pattern: ^\d{16}$
          maxLength: 32
          description: 订单号（16 位数字）
        pickupCode:
          type: string
          pattern: ^[A-Z]\d{3}$
          maxLength: 8
          description: 取餐号，如 A018
        storeId:
          type: string
          format: int64
          description: 门店ID（单店阶段固定 1）
        fulfillType:
          type: string
          enum:
          - pickup
          maxLength: 16
          description: 履约方式：仅 pickup（到店自取）
        itemCount:
          type: integer
          format: int32
          minimum: 1
          description: 商品件数 = Σ items.qty
        subtotalCent:
          type: integer
          format: int64
          minimum: 0
          description: 商品小计（分）
        couponOffCent:
          type: integer
          format: int64
          minimum: 0
          description: 券抵扣（分）
        payableCent:
          type: integer
          format: int64
          minimum: 0
          description: 应付 = subtotalCent - couponOffCent（分）
        balancePayCent:
          type: integer
          format: int64
          minimum: 0
          description: 储值支付（分）；已支付时与 wechatPayCent 之和须等于 payableCent
        wechatPayCent:
          type: integer
          format: int64
          minimum: 0
          description: 微信支付（分）；已支付时与 balancePayCent 之和须等于 payableCent
        couponId:
          type:
          - string
          - 'null'
          format: int64
          description: 使用的用户券ID，未用券为 null
        payMode:
          type: string
          enum:
          - balance
          - wechat
          - mixed
          maxLength: 16
          description: balance 储值 / wechat 微信 / mixed 组合
        payStatus:
          type: string
          enum:
          - unpaid
          - paid
          - refunded
          - closed
          maxLength: 16
          description: 支付状态
        orderStatus:
          type: string
          enum:
          - created
          - paid
          - making
          - ready
          - completed
          - refund_pending
          - refunding
          - refund_error
          - refunded
          - cancelled
          maxLength: 16
          description: 订单状态；making/ready 为后端兼容值，当前小程序不推进制作/取餐状态。退款申请、退款中、失败和完成分别为 refund_pending/refunding/refund_error/refunded。
        remark:
          type: string
          maxLength: 255
          description: 备注
        createTime:
          type: string
          format: date-time
          readOnly: true
          description: 创建时间（ISO-8601 +08:00）
        paidAt:
          type:
          - string
          - 'null'
          format: date-time
          description: 支付完成时间
        finishedAt:
          type:
          - string
          - 'null'
          format: date-time
          description: 完成/取餐时间
        cancelledAt:
          type:
          - string
          - 'null'
          format: date-time
          description: 取消时间
        items:
          type: array
          minItems: 1
          maxItems: 50
          description: 订单明细，1..50 条
          items:
            $ref: '#/components/schemas/OrderItem'
        tableNo:
          type: string
          description: 桌号；未关联桌位时为空串。
        refundReason:
          type: string
          description: 退款原因；未申请时为空串。
        refundRequestedAt:
          type:
          - string
          - 'null'
          format: date-time
          description: 申请退款时间
        refundedAt:
          type:
          - string
          - 'null'
          format: date-time
          description: 退款完成时间
        payDeadline:
          type:
          - string
          - 'null'
          format: date-time
          description: 支付截止时间；按创建时间和服务端超时配置计算，不能据此推断支付成功
      required:
      - id
      - orderNo
      - fulfillType
      - payMode
      - payStatus
      - orderStatus
      - createTime
      - items
    ErrorResult:
      type: object
      title: ErrorResult
      description: cosen /app 接口统一错误信封：code=业务码（见错误码规范），data=null，traceId=链路ID
      required:
      - code
      - msg
      - traceId
      properties:
        code:
          type: integer
          description: 业务码：200=成功；非 200 见错误码规范（40101/40405/40901/40903 等）
        msg:
          type: string
          description: 错误文案（面向用户/前端）
        data:
          type:
          - object
          - 'null'
          description: 错误时固定为 null
        traceId:
          type: string
          description: 服务端链路 ID
    RechargeTier:
      type: object
      title: RechargeTier
      description: 充值档位（配置来源：环境配置 cosen.recharge.tiers；系统主，不同步 Base）
      properties:
        tierCode:
          type: string
          maxLength: 32
          pattern: ^TIER_[A-Z0-9_]{1,27}$
          description: 档位编码，如 TIER_500_100
        name:
          type: string
          maxLength: 32
          description: 档位名（如 醇香储值）
        amountCent:
          type: integer
          format: int64
          minimum: 1
          description: 实充金额（分）
        bonusCent:
          type: integer
          format: int64
          minimum: 0
          description: 赠送金额（分）
        totalCent:
          type: integer
          format: int64
          minimum: 1
          description: 到账合计（分，实充+赠送）
        note:
          type: string
          maxLength: 32
          description: 展示文案（如 相当于 8.3 折）
        hot:
          type: boolean
          description: 是否推荐档位
        campaignId:
          type: string
          maxLength: 32
          description: 活动编码（环境配置）
        available:
          type: boolean
          description: 当前是否可购买（活动期/上下线）
      required:
      - tierCode
      - name
      - amountCent
      - bonusCent
      - totalCent
      - available
    WxPayParams:
      type: object
      title: WxPayParams
      description: 微信小程序支付拉起参数，订单支付、充值创建和门店收款预支付复用；示例为不可用演示值，勿缓存或记录真实支付签名。取得参数不代表已支付。
      properties:
        prepayId:
          type: string
          maxLength: 64
          description: 充值响应可附带的微信预支付 ID；订单与门店收款使用 package，不单独返回此字段。
        timeStamp:
          type: string
          maxLength: 16
          description: 秒级时间戳（字符串，避免 JS 精度丢失）
        nonceStr:
          type: string
          maxLength: 32
          description: 随机串
        package:
          type: string
          maxLength: 128
          description: prepay_id=xxx
        signType:
          type: string
          enum:
          - RSA
          - HMAC-SHA256
          description: 签名算法
        paySign:
          type: string
          maxLength: 512
          description: 支付签名
        appId:
          type: string
          description: 微信小程序 AppID；真实支付网关返回，mock 充值响应可省略。
      required:
      - timeStamp
      - nonceStr
      - package
      - signType
      - paySign
    RechargeOrder:
      type: object
      title: RechargeOrder
      description: 充值单（对应表 cosen_recharge_order）；金额单位分，status 走 pending/paid/closed/failed
      properties:
        rechargeNo:
          type: string
          maxLength: 40
          pattern: ^RC[0-9]{14,20}$
          description: 充值单号（微信 out_trade_no）
        tierCode:
          type: string
          maxLength: 32
          description: 档位编码
        campaignId:
          type: string
          maxLength: 32
          description: 活动编码
        amountCent:
          type: integer
          format: int64
          minimum: 1
          description: 实充金额（分）
        bonusCent:
          type: integer
          format: int64
          minimum: 0
          description: 赠送金额（分）
        totalCent:
          type: integer
          format: int64
          minimum: 1
          description: 到账合计（分）
        payMode:
          type: string
          enum:
          - wechat
          description: 第一切片固定 wechat
        status:
          type: string
          enum:
          - pending
          - paid
          - closed
          - failed
          description: pending 待支付 / paid 已到账 / closed 已关闭 / failed 支付失败
        failCode:
          type:
          - integer
          - 'null'
          format: int32
          description: 失败业务码预留字段；当前实现返回 null，不应依赖此字段判断状态。
        failMsg:
          type:
          - string
          - 'null'
          maxLength: 128
          description: 失败文案预留字段；当前实现返回 null。
        expireAt:
          type:
          - string
          - 'null'
          format: date-time
          description: 支付超时时间（仅 pending 期间有意义）
        paidAt:
          type:
          - string
          - 'null'
          format: date-time
          description: 到账时间
        flowNo:
          type:
          - string
          - 'null'
          maxLength: 40
          description: 对应账本流水号（cosen_member_balance_flow.flow_no）
        balanceAfterCent:
          type: integer
          format: int64
          description: 到账后可用余额（分）
        giftBalanceAfterCent:
          type: integer
          format: int64
          description: 到账后赠送余额（分）
        wx:
          $ref: '#/components/schemas/WxPayParams'
      x-table: cosen_recharge_order
      required:
      - rechargeNo
      - tierCode
      - amountCent
      - bonusCent
      - totalCent
      - payMode
      - status
    PayOrderResult:
      title: PayOrderResult
      description: 订单详情及可选微信支付参数；余额支付可直接 paid，真实微信/组合预支付仍为 created/unpaid，最终状态由微信回调更新。
      allOf:
      - $ref: '#/components/schemas/OrderDetail'
      - type: object
        properties:
          wechatPayParams:
            oneOf:
            - $ref: '#/components/schemas/WxPayParams'
            - type: 'null'
            description: 真实微信/组合预支付返回；余额支付通常省略。须使用当前付款微信身份拉起支付。
    UpdateMemberProfileReq:
      type: object
      description: 昵称或头像至少一个非 null。phone 非 null 不允许；不包含文件上传。 客户端应发送规范化字符串（去除允许 trim 字段的首尾空白）；本模型的长度、枚举和 URL 前缀约束针对规范化值，是推荐请求子集，不枚举服务端所有宽松输入。
      properties:
        nickname:
          type:
          - string
          - 'null'
          minLength: 1
          maxLength: 32
          description: trim 后非空且最多 32 字符
        avatarUrl:
          type:
          - string
          - 'null'
          maxLength: 500
          description: trim 后长度最多 500；空串可清除；实现不验证 URL 格式
        phone:
          type: 'null'
          description: 非 null 一律拒绝；绑定手机号请使用专用微信验证接口
      anyOf:
      - required:
        - nickname
        properties:
          nickname:
            type: string
      - required:
        - avatarUrl
        properties:
          avatarUrl:
            type: string
    OrderRefundReq:
      type: object
      properties:
        reason:
          type:
          - string
          - 'null'
          maxLength: 200
          description: trim 后最多 200；省略/null/空串采用用户申请退款；退款态重放不重新校验
      description: ' 客户端应发送规范化字符串；长度、枚举与 URL 前缀约束针对规范化值，是推荐请求子集，不枚举服务端所有宽松输入。'
    SubmitOrderReviewReq:
      type: object
      properties:
        rating:
          type: integer
          minimum: 1
          maximum: 5
        content:
          type:
          - string
          - 'null'
          maxLength: 500
          default: ''
          description: 不 trim，null 按空串处理
        images: &id018
          type:
          - array
          - 'null'
          maxItems: 3
          description: 已上传图片 URL；元素先 trim，再验证长度/前缀。不是文件内容。
          items:
            type: string
            minLength: 1
            maxLength: 500
            pattern: ^(https?://|/).+
      required:
      - rating
      description: ' 客户端应发送规范化字符串；长度、枚举与 URL 前缀约束针对规范化值，是推荐请求子集，不枚举服务端所有宽松输入。'
    OrderReview:
      type: object
      properties:
        id:
          type: string
          description: 评价 ID
        orderNo:
          type: string
          pattern: ^\d{16}$
        rating:
          type: integer
          minimum: 1
          maximum: 5
        content:
          type: string
          maxLength: 500
        images:
          type: array
          items:
            type: string
        createdAt:
          type:
          - string
          - 'null'
          format: date-time
          description: 创建时间；历史缺失时间可为 null
      required:
      - id
      - orderNo
      - rating
      - content
      - images
      - createdAt
    SubmitFeedbackReq:
      type: object
      properties:
        type:
          type: string
          enum:
          - product
          - service
          - other
          description: trim 后校验
        content:
          type: string
          minLength: 1
          maxLength: 1000
          description: trim 后非空且最多 1000 字符
        contact:
          type:
          - string
          - 'null'
          maxLength: 64
          default: ''
          description: trim 后最多 64；null 按空串处理
        images: *id018
      required:
      - type
      - content
      description: ' 客户端应发送规范化字符串（去除允许 trim 字段的首尾空白）；本模型的长度、枚举和 URL 前缀约束针对规范化值，是推荐请求子集，不枚举服务端所有宽松输入。'
    FeedbackCreated:
      type: object
      properties:
        id:
          type: string
          description: 反馈 ID
      required:
      - id
    CloseMyAccountReq:
      type: object
      properties:
        reason:
          type:
          - string
          - 'null'
          maxLength: 200
          description: 不 trim，仅校验长度，不存储
    CollectionEntry:
      type: object
      properties:
        title:
          type: string
          const: 可森 COSEN 门店收款
      required:
      - title
    CollectionPrepayReq:
      type: object
      properties:
        scene:
          type: string
          description: 必须等于当前启用收款码的 scene
        code:
          type: string
          minLength: 1
          maxLength: 256
          description: uni.login 得到的一次性微信登录 code；不可为空白
        intent:
          type: string
          pattern: ^[a-zA-Z0-9-]{16,64}$
          description: 客户端幂等意图标识；相同 scene+openid+intent 不得改变金额
        amountCent:
          type: integer
          format: int64
          minimum: 1
          maximum: 10000000
          description: 付款金额（分），必须为 JSON 整数，100.0 不被 isIntegralNumber 接受
      required:
      - scene
      - code
      - intent
      - amountCent
    CollectionPrepayResult:
      type: object
      properties:
        payNo:
          type: string
          pattern: ^QR[0-9a-f]{30}$
        receiptKey:
          type: string
          pattern: ^[0-9a-f]{32}$
          description: 查询回执的凭据；不能公开
        status:
          type: string
          enum:
          - pending
          - paid
          - refunding
          - refunded
          - refund_error
        amountCent:
          type: integer
          format: int64
          minimum: 1
          maximum: 10000000
        wechatPayParams:
          $ref: '#/components/schemas/WxPayParams'
      required:
      - payNo
      - receiptKey
      - status
      - amountCent
    CollectionReceipt:
      type: object
      properties:
        status:
          type: string
          description: 当前收款状态，已知 pending/paid/closed/refunding/refunded/refund_error；不限制枚举以兼容账务扩展
        amountCent:
          type: integer
          format: int64
          minimum: 1
          maximum: 10000000
      required:
      - status
      - amountCent
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: UUID
  examples:
    paramMissing:
      summary: 缺少必填参数
      value:
        code: 40001
        msg: 缺少必填参数
        data: null
        traceId: c8f1d2e3
    paramInvalid:
      summary: 参数格式/枚举非法
      value:
        code: 40003
        msg: 参数取值不合法
        data: null
        traceId: c8f1d2e4
    invalidFormat:
      summary: 参数格式错误
      value:
        code: 40002
        msg: 参数格式错误
        data: null
        traceId: c8f1d310
    tokenMissing:
      summary: 未登录
      value:
        code: 40101
        msg: 请先登录
        data: null
        traceId: c8f1d2e5
    tokenExpired:
      summary: token 过期
      value:
        code: 40104
        msg: 登录已过期，请重新登录
        data: null
        traceId: c8f1d2e6
    adminToken:
      summary: token 类型错误
      value:
        code: 40105
        msg: 登录状态无效，请重新登录
        data: null
        traceId: c8f1d2e7
    tokenRevoked:
      summary: token 已注销或被踢
      value:
        code: 40106
        msg: 登录状态已失效，请重新登录
        data: null
        traceId: c8f1d311
    tooManyRequests:
      summary: 请求过于频繁
      value:
        code: 42901
        msg: 操作过于频繁，请稍后重试
        data: null
        traceId: c8f1d2f1
    tooManyOrders:
      summary: 下单/支付过于频繁
      value:
        code: 42902
        msg: 下单过于频繁，请稍后再试
        data: null
        traceId: c8f1d312
    internalError:
      summary: 服务器内部错误
      value:
        code: 50001
        msg: 服务开小差了，请稍后重试
        data: null
        traceId: c8f1d2f2
    consistencyError:
      summary: 数据一致性错误（需告警）
      value:
        code: 50002
        msg: 数据校验异常，请稍后重试
        data: null
        traceId: c8f1d316
    serviceUnavailable:
      summary: 依赖不可用
      value:
        code: 50302
        msg: 系统繁忙，请稍后重试
        data: null
        traceId: c8f1d2f3
    wechatUnavailable:
      summary: 微信服务不可用
      value:
        code: 50301
        msg: 微信服务暂不可用，请稍后重试
        data: null
        traceId: c8f1d317
    noPermission:
      summary: 越权访问
      value:
        code: 40301
        msg: 无权访问该资源
        data: null
        traceId: c8f1d2e8
    mockDisabled:
      summary: mock 登录未启用
      value:
        code: 40302
        msg: 当前环境未开启联调登录
        data: null
        traceId: c8f1d2e9
    balanceNotEnough:
      summary: 余额不足
      value:
        code: 40903
        msg: 余额不足
        data: null
        traceId: c8f1d2ed
    couponUnavailable:
      summary: 券不可用
      value:
        code: 40907
        msg: 该券当前不可用
