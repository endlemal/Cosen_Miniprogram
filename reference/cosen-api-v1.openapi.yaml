        memberId:
          type: string
          format: int64
          description: 持有人ID（bigint ID，JSON 用字符串避免精度丢失）
        templateCode:
          type: string
          maxLength: 32
          description: 发放模板编码（后台发券/活动）
        title:
          type: string
          maxLength: 64
          description: 券标题（雨天暖心券…）
        type:
          type: string
          enum:
