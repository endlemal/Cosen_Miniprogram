                      bonusCent: 10000
                      totalCent: 60000
                      payMode: wechat
                      status: pending
                      expireAt: '2026-11-18T00:20:00+08:00'
                      wx:
                        prepayId: wx201411101639507cbf6ffd8b07799511
                        timeStamp: '1763398000'
                        nonceStr: 5K8264ILTKCH16CQ2502SI8ZNMTM67VS
                        package: prepay_id=wx201411101639507cbf6ffd8b07799511
