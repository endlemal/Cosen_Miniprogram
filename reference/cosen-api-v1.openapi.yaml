      security: *id002
      parameters:
      - &id011
        name: orderNo
        in: path
        required: true
        description: 16 位订单号，格式错误、不存在或非本人均按 40404 处理
        schema:
          type: string
          pattern: ^\d{16}$
        example: '2026110800000001'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrderRefundReq'
            example:
              reason: 不再需要
      responses:
        '200':
          description: 当前订单详情；新申请状态为 refund_pending，重复申请返回原退款状态
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/AppResult'
                - type: object
                  properties:
                    data:
                      $ref: '#/components/schemas/OrderDetail'
                  required:
                  - data
        '400': *id007
        '401': *id008
        '404':
          description: 订单不存在或非本人（40404）；会员不存在（40405）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResult'
        '409':
          description: 会员停用（40901）或订单状态不允许退款/并发更新失败（40916）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResult'
              example:
                code: 40916
                msg: 订单状态不允许该操作
                data: null
                traceId: example00003
        '500': *id009
        '503': *id010
  /app/orders/{orderNo}/review:
    post:
      operationId: submitMyOrderReview
      summary: 提交本人订单评价
      tags:
      - app/订单评价
      description: '仅订单状态 paid 或 completed 允许评价（不是只允许 completed，making/ready 也不在当前允许列表）。

        每订单只可提交一次，重复或并发重复均返回 40928。rating 必填，1..5 整数；content 可省略/null，按空串存储，不 trim。

        images 可省略/null，按空数组处理，最多 3 个；每个 URL trim 后非空、长度最多 500，且以 http://、https:// 或 / 开头。

        此接口仅接收已有图片 URL，不上传文件。

        '
      security: *id002
      parameters:
      - *id011
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubmitOrderReviewReq'
            example:
              rating: 5
              content: 味道很好
              images: []
      responses:
        '200': &id012
          description: 订单评价（AppResult 信封）
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/AppResult'
                - type: object
                  properties:
                    data:
                      $ref: '#/components/schemas/OrderReview'
                  required:
                  - data
              example:
                code: 200
                msg: ok
                traceId: example00004
                data:
                  id: '1'
                  orderNo: '2026110800000001'
                  rating: 5
                  content: 味道很好
                  images: []
                  createdAt: '2026-11-23T08:00:00+08:00'
        '400': *id007
        '401': *id008
        '404':
          description: 订单号格式错误、订单不存在或非本人（40404）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResult'
        '409':
          description: 订单状态不可评价（40927）或订单已评价（40928）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResult'
              examples:
                notAllowed:
                  value:
                    code: 40927
                    msg: 订单不可评价
                    data: null
                    traceId: example00005
                duplicate:
                  value:
                    code: 40928
                    msg: 订单已评价
                    data: null
                    traceId: example00006
        '500': *id009
        '503': *id010
    get:
      operationId: getMyOrderReview
      summary: 查询本人订单评价
      tags:
      - app/订单评价
      description: 无评价返回 HTTP 404 + code 40409，不返回成功 null；订单不存在/非本人/订单号非法返回 40404。
      security: *id002
      parameters:
      - *id011
      responses:
        '200': *id012
        '401': *id008
        '404':
          description: 订单非法/不存在/非本人（40404）或尚无评价（40409）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResult'
              example:
                code: 40409
                msg: 评价不存在
                data: null
                traceId: example00007
        '500': *id009
        '503': *id010
  /app/feedback:
    post:
      operationId: submitMyFeedback
      summary: 提交意见反馈
      tags:
      - app/反馈
      description: '需要登录会话，游客可提交，不要求先验证手机号。type、content 必填，去首尾空白后校验；contact 可省略/null。

        images 可省略/null，最多 3 个；URL 校验与订单评价相同，仅接收 URL，不提供上传能力。

        '
      security: *id002
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubmitFeedbackReq'
            example:
              type: service
              content: 希望增加营业时间
              contact: ''
              images: []
      responses:
        '200':
          description: 反馈已记录，返回反馈 ID
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/AppResult'
                - type: object
                  properties:
                    data:
                      $ref: '#/components/schemas/FeedbackCreated'
                  required:
                  - data
              example:
                code: 200
                msg: ok
                traceId: example00008
                data:
                  id: '1'
        '400': *id007
        '401': *id008
        '500': *id009
        '503': *id010
  /app/account/close:
    post:
      operationId: closeMyAccount
      summary: 退出登录（原注销账号已下线）
      tags:
      - app/账号
      description: '需要有效登录会话；2026-11-24 起小程序已下线账号注销，本接口仅作为旧客户端兼容的退出登录：清除当前 token，不再解绑微信 openid、不再设置会员 closed_at，也不改动余额、券、订单或流水。

        新客户端请使用 POST /app/auth/logout。旧客户端重复调用本接口是幂等的（只清 token）；reason 字段仍可携带但被忽略。

        '
      security: *id002
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CloseMyAccountReq'
            example:
              reason: 暂不使用（兼容字段，忽略）
      responses:
        '200':
          description: 当前 token 已清除；data 为 null（不再解绑身份或关闭会员）
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/AppResult'
                - type: object
                  properties:
                    data:
                      type: 'null'
                  required:
                  - data
              example:
                code: 200
                msg: ok
                traceId: example00009
                data: null
        '400': *id007
        '401': *id008
        '404':
          description: 会员不存在或已删除（40405）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResult'
        '500': *id009
        '503': *id010
  /app/store/collection:
    get:
      operationId: getStoreCollectionEntry
      summary: 校验门店收款场景
      tags:
      - app/门店收款
      description: 公开接口，无需会员 token；scene 必须与当前启用的收款码场景完全相等。
      security: []
      parameters:
      - &id014
        name: scene
        in: query
        required: true
        description: 门店收款码当前 scene（不是会员 token）
        schema:
          type: string
        example: example-scene
      responses:
        '200':
          description: 收款页面标题
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/AppResult'
                - type: object
                  properties:
                    data:
                      $ref: '#/components/schemas/CollectionEntry'
                  required:
                  - data
              example:
                code: 200
                msg: ok
                traceId: example00010
                data:
                  title: 可森 COSEN 门店收款
        '400': *id007
        '404': &id013
          description: 收款码已更换/场景不匹配（40410）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResult'
              example:
                code: 40410
                msg: 收款码已更换，请扫描门店最新收款码
                data: null
                traceId: example00011
        '500': *id009
        '503': *id010
  /app/store/collection/prepay:
    post:
      operationId: prepayStoreCollection
      summary: 发起门店扫码收款微信支付
      tags:
      - app/门店收款
      description: '公开接口，不使用会员 bearer。以当次 uni.login 获得的 code 换取 openid。

        scene 必须是当前收款码；intent 由客户端生成，同 scene+openid+intent 确定同一个 payNo，重试复用预支付单。

        相同 intent 更改金额返回 HTTP 400/code 40007；保留首次到期时间（30 分钟），过期不自动延长。

        pending 响应带 wechatPayParams，客户端调起支付后仍须查询 receipt 确认；不是支付成功即刻回执。

        已 paid/refunding/refunded/refund_error 时幂等返回原状态，不再带 wechatPayParams。

        receiptKey 是查询回执的凭据，应妥善保存，不可公开或写入日志。

        '
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CollectionPrepayReq'
            example:
              scene: example-scene
              code: example-wechat-login-code
              intent: example-intent-0001
              amountCent: 100
      responses:
        '200':
          description: 预支付参数或已存在收款状态
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/AppResult'
                - type: object
                  properties:
                    data:
                      $ref: '#/components/schemas/CollectionPrepayResult'
                  required:
                  - data
              example:
                code: 200
                msg: ok
                traceId: example00012
                data:
                  payNo: QR000000000000000000000000000000
                  receiptKey: '00000000000000000000000000000000'
                  status: pending
                  amountCent: 100
                  wechatPayParams:
                    timeStamp: '1795392000'
                    nonceStr: example-nonce
                    package: prepay_id=example
                    signType: RSA
                    paySign: example-signature
        '400':
          description: 参数非法/金额不是整数（40002），或同 intent 金额不一致（40007）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResult'
        '401':
          description: 微信 code 换取 openid 失败（40102）；并非要求会员 bearer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResult'
        '404': *id013
        '409':
          description: 本次付款已过期（40929）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResult'
        '502':
          description: 微信支付下单失败（业务码 40922）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResult'
        '503':
          description: 微信支付未配置或不可用（50305），微信依赖不可用（50301），数据库/Redis 依赖不可用（50302）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResult'
        '500': *id009
  /app/store/collection/receipts/{no}:
    get:
      operationId: getStoreCollectionReceipt
      summary: 查询门店扫码付款回执
      tags:
      - app/门店收款
      description: '不要求会员 bearer，但必须提供与 payNo 匹配的 X-Receipt-Key。

        服务端注解虽 required=false，业务会拒绝缺失/格式错误/不匹配的凭据，均返回 40404，防止枚举。

        pending 时会尝试查询微信支付后返回当前状态，不保证客户端请求时已经完成结算。

        '
      security: []
      parameters:
      - name: 'no'
        in: path
        required: true
        description: prepay 返回的 payNo
        schema:
          type: string
          pattern: ^QR[0-9a-f]{30}$
        example: QR000000000000000000000000000000
      - name: X-Receipt-Key
        in: header
        required: true
        description: prepay 返回的 receiptKey，32 位小写十六进制；不是会员 token
        schema:
          type: string
          pattern: ^[0-9a-f]{32}$
        example: '00000000000000000000000000000000'
      responses:
        '200':
          description: 当前收款状态及金额
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/AppResult'
                - type: object
                  properties:
                    data:
                      $ref: '#/components/schemas/CollectionReceipt'
                  required:
                  - data
              example:
                code: 200
                msg: ok
                traceId: example00013
                data:
                  status: paid
                  amountCent: 100
        '404':
          description: 收款回执不存在、编号格式错误或查询凭据无效（40404）；不使用会员身份判断归属。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResult'
        '500': *id009
        '503': *id010
  /app/store/table-entrance:
    get:
      operationId: openStoreTableEntrance
      summary: 打开桌码小程序入口（HTML/跳转）
      tags:
      - app/门店入口
      description: 兼容已印桌码。公开浏览器入口，正常响应不是 AppResult；优先跳转微信链接，微信链接不可用时返回正式小程序码 HTML。
      security: []
      parameters:
      - name: tableNo
        in: query
        required: true
        description: 必须是启用中的桌位
        schema:
          type: string
          pattern: ^[A-Z0-9_-]{1,24}$
        example: A01
      responses:
        '200': &id015
          description: 包含正式小程序码图片的 HTML 兜底页
          content:
            text/html:
              schema:
                type: string
              example: <html lang="zh"><title>可森小程序码</title><img alt="可森小程序码" src="data:image/png;base64,..."></html>
        '302': &id016
          description: 跳转微信小程序 URL Link
          headers:
            Location:
              description: 微信 wxaurl.cn URL
              schema:
                type: string
                format: uri
              example: https://wxaurl.cn/example
            Cache-Control:
              description: 禁止缓存入口跳转
              schema:
                type: string
              example: no-store
        '400':
          description: 桌位格式错误、不存在或停用（40002）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResult'
        '500': *id009
        '503': &id017
          description: 链接及小程序码均无法获取时，微信依赖不可用（50301/50302）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResult'
  /app/store/collection-entrance:
    get:
      operationId: openStoreCollectionEntrance
      summary: 打开收款码小程序入口（HTML/跳转）
      tags:
      - app/门店入口
      description: 公开浏览器入口，优先跳转微信小程序收款页；链接不可用时返回正式小程序码 HTML；过期 scene 返回 HTTP 410 HTML 而不是 40410 JSON。
      security: []
      parameters:
      - *id014
      responses:
        '200': *id015
        '302': *id016
        '410':
          description: 该收款码已更换
          content:
            text/html:
              schema:
                type: string
              example: <html lang="zh"><title>可森收款码</title><h1>该收款码已更换</h1></html>
        '400': *id007
        '500': *id009
        '503': *id017
components:
  schemas:
    StoreSubscribeTemplates:
      type: object
      title: StoreSubscribeTemplates
      description: 门店已配置的微信订阅消息分场景模板 ID 映射（未配置的场景不返回）
      properties:
        orderReceipt:
          type: string
          description: 消费成功通知（电子小票）模板 ID（后台人工确认并填写备注后手动发送）
        orderReady:
          type: string
          description: 订单完成 / 取餐提醒模板 ID（商家点击完成订单时触发）
        orderPaid:
          type: string
          description: 下单支付成功通知模板 ID（支付成功时触发）
        orderRefund:
          type: string
          description: 退款结果通知模板 ID（退款完成或驳回时触发）
    StoreInfo:
      type: object
      title: StoreInfo
      description: 门店公开信息与小程序配置
      properties:
        storeId:
          type: string
          description: 门店 ID
        squareEnabled:
          type: boolean
          description: 小程序广场页是否开启
        name:
          type: string
          description: 门店名称
        subtitle:
          type: string
          description: 门店副标题/空间说明
        address:
          type: string
          description: 门店地址
        phone:
          type: string
          description: 门店联系电话
        status:
          type: string
          enum:
          - 'on'
          - 'off'
          description: 营业开关
        openNow:
          type: boolean
          description: 当前时刻是否营业中
        businessHours:
          type: array
          items:
            type: object
            properties:
              days:
                type: string
              open:
                type: string
              close:
                type: string
        closedDays:
          type: array
          items:
            type: string
        announcements:
          type: array
          items:
            type: string
        customerService:
          type: object
          properties:
            type:
              type: string
            value:
              type: string
        subscribeTemplateIds:
          type: array
          description: 去重后的已配置微信订阅消息模板 ID 列表
          items:
            type: string
        subscribeTemplates:
          $ref: '#/components/schemas/StoreSubscribeTemplates'
      required:
      - name
      - subscribeTemplateIds
      - subscribeTemplates
    OrderSubscribeReq:
      type: object
      title: OrderSubscribeReq
      description: 订单微信订阅消息授权上报请求
      properties:
        templateIds:
          type: array
          description: 用户同意（accept）的模板 ID 列表（兼容旧版客户端仅传该字段）
          maxItems: 3
          items:
            type: string
        results:
          type: object
          description: 微信 requestSubscribeMessage 返回的各模板真实结果（键为 templateId，值为 accept/reject/ban/filter）
          additionalProperties:
            type: string
            enum:
            - accept
            - reject
            - ban
            - filter
        scene:
          type: string
          enum:
          - order_pay
          - order_refund
          - order_detail
          description: 小程序触发订阅的页面场景
    OrderSubscribeResp:
      type: object
      title: OrderSubscribeResp
      description: 订单微信订阅消息授权上报响应
      properties:
        subscribed:
          type: boolean
          description: 本次是否至少成功落库 1 条有效模板授权
        acceptedTemplateIds:
          type: array
          description: 已校验配置并落库的模板 ID 列表
          items:
            type: string
        ignoredTemplateIds:
          type: array
          description: 被用户拒绝、未在后端配置或缺少 openid 而忽略的模板 ID 列表
          items:
            type: string
        activeScenes:
          type: array
          description: 本次生效的业务通知场景列表
          items:
            type: string
            enum:
            - order_receipt
            - order_ready
            - order_paid
            - order_refund
            - general
      required:
      - subscribed
      - acceptedTemplateIds
      - ignoredTemplateIds
      - activeScenes
    MemberSubscribeReq:
      type: object
      title: MemberSubscribeReq
      description: 会员级微信订阅消息授权上报请求
      properties:
        templateIds:
          type: array
          description: 用户同意授权的模板 ID 列表（最多 3 个）
          maxItems: 3
          items:
            type: string
        results:
          type: object
          description: 各模板真实授权决策（accept/reject/ban/filter）
          additionalProperties:
            type: string
            enum:
            - accept
            - reject
            - ban
            - filter
        scene:
          type: string
          description: 触发场景
          enum:
          - member_center
          - silent_refill
          - recharge
    MemberSubscribeResp:
      type: object
      title: MemberSubscribeResp
      description: 会员级微信订阅消息授权上报响应
      properties:
        subscribed:
          type: boolean
          description: 本次是否至少成功累加 1 条有效模板额度
        acceptedTemplateIds:
          type: array
          description: 已校验配置并累加额度的模板 ID 列表
          items:
            type: string
        ignoredTemplateIds:
          type: array
          description: 被拒绝、未配置或缺少 openid 而忽略的模板 ID 列表
          items:
            type: string
        activeScenes:
          type: array
          description: 本次生效的业务通知场景列表
          items:
            type: string
            enum:
            - order_receipt
            - order_ready
            - order_paid
            - order_refund
            - general
        remainingCount:
          type: integer
          minimum: 0
          description: 该会员当前记录的消费成功通知剩余估算次数
      required:
      - subscribed
      - acceptedTemplateIds
      - ignoredTemplateIds
      - activeScenes
      - remainingCount
    MemberProfile:
      type: object
      title: MemberProfile
      description: 会员侧对外脱敏模型，不含 openid/unionid/明文手机号/version/deleted
      properties:
        realName:
          type: string
          maxLength: 32
          description: 会员选填姓名
        id:
          type: string
          format: int64
          readOnly: true
