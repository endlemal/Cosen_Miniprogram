  /app/recharges:
    post:
      operationId: createRecharge
      summary: 创建充值单
      description: |
        创建储值充值单并拉起微信支付。金额单位分；档位按 tierCode 由服务端校验，不信任前端金额。
        幂等：Header Idempotency-Key 必填；同 key 同 payload 重放返回 HTTP 200 + 原充值单（不新增单据、不用 40925）；同 key 不同 payload 返回 40007。
        充值成功触发会员等级重算（累计实充只计本金，满 2000 元升级深焙）。
      tags:
      - app/充值
      parameters:
      - name: Idempotency-Key
        in: header
        required: true
        description: 充值幂等键（UUID 或 8..64 位字符串）；缺失/非法返回 40007
        schema:
          type: string
          minLength: 8
          maxLength: 64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - tierCode
              properties:
                tierCode:
                  type: string
                  maxLength: 32
                  description: 档位编码，如 TIER_500_100
                payMode:
                  type: string
                  enum:
                  - wechat
                  default: wechat
                  description: 第一切片固定 wechat（储值余额不能给自己充值）
              example:
                tierCode: TIER_500_100
                payMode: wechat
      responses:
        '403':
          description: 游客需要先通过微信验证手机号（40310）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResult'
        '200':
          description: OK（新建或幂等重放原充值单）
          content:
            application/json:
              schema:
                type: object
                description: 充值单（含微信支付拉起参数）
                allOf:
                - $ref: '#/components/schemas/AppResult'
                - type: object
                  properties:
                    data:
                      $ref: '#/components/schemas/RechargeOrder'
              examples:
                success:
