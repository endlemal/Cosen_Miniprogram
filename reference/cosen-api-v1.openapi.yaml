        同 key 同 payload 重放返回 HTTP 200 + code 40925（返回原订单）；同 key 不同 payload 返回 40007。

        金额一律由服务端按商品价重算，不信任前端传入的金额。

        游客仅可不用券的普通微信支付；用券、余额或组合支付需已验证手机号，否则 HTTP 403 / 40310。'
      tags:
      - app/订单
      parameters:
      - name: Idempotency-Key
        in: header
        required: false
        description: 下单幂等键，与 body.idempotencyKey 二选一必填；UUID 或 8..64 位字符串
        schema:
          type: string
          minLength: 8
          maxLength: 64
      responses:
        '200':
          description: OK（成功或幂等重放）
          content:
            application/json:
              schema:
                type: object
