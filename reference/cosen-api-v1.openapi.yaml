openapi: 3.1.0
info:
  title: cosen 业务接口
  version: 1.5.0
  description: 可森小程序后端第一切片 API 契约（ETL 后的 DDL/model 对齐版），供 Apifox 审阅。后台管理接口见「RuoYi
    基础接口」模块。v1.1.0：按飞书多维表格口径对齐，Product.badge 改为多选数组（招牌/人气/限定/新品/可森特调），CouponUser.source 枚举补 redeem（积分或活动兑换发放）；接口路径、参数、错误码语义不变。v1.2.0：错误码响应示例对齐 error-codes.md v1.0.0（新增 40106/40002/42902/50002/50301 与券冲突 40908–40910 示例，修正 40002 与 40003、42901 与 42902 的误用），接口路径、参数与错误码语义不变。v1.3.0：充值纳入第一切片，新增 3 个接口（档位列表 / 创建充值单 / 状态查询）、RechargeTier/RechargeOrder/WxPayParams 模型、40407 充值单不存在或非本人，以及 40904/40905/40906/42904 示例；既有 16 个接口不变。v1.4.0：成功响应补齐 traceId（AppResult/PageResult required + 19 个 200 示例），RechargeOrder 增加可选 failCode/failMsg，充值创建 409 移除回调专属 40906，products 的 category 参数明确为分类 code（非分类 ID）；接口路径与参数不变。v1.4.1：修正 40921 挂载（pay 专属，HTTP 400），从 POST /app/orders 的 409 移除。v1.5.0：Product 增加 coverUrl（相册第一张，相对路径）与 gallery（相册图片数组，第一张即封面）；商品图片由 Base「商品相册」附件同步落地为静态资源；既有接口路径与参数不变。
servers:
- url: http://127.0.0.1:8080
  description: macbook 本机
tags:
- name: app/认证
  description: 微信登录 / 联调登录 / 手机号绑定
- name: app/会员
  description: 会员资料 / 储值余额 / 流水
- name: app/商品
  description: 分类 / 商品（点单）
- name: app/优惠券
  description: 券背包 / 券详情
- name: app/订单
  description: 下单 / 支付 / 查询 / 取消
- name: app/充值
  description: 储值档位 / 创建充值单 / 充值状态查询
paths:
  /app/auth/login/wechat:
    post:
      operationId: loginByWechat
      summary: 微信登录与手机号认领
      description: 无 phoneCode 时使用当前微信静默建立会话，游客可微信支付下单；有 phoneCode 时仅接受微信服务端验证的号码。同号自动认领或共用会员余额、券及会员资料。付款使用本次会话的微信身份。
      tags:
      - app/认证
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                description: 登录结果
                allOf:
                - $ref: '#/components/schemas/AppResult'
                - type: object
                  properties:
                    data:
                      $ref: '#/components/schemas/LoginResp'
              examples:
                success:
                  summary: 微信静默登录成功（已绑定会员）
                  value:
                    traceId: c8f1e001
                    code: 200
                    msg: ok
                    data:
                      token: 3f1c9a2e-8b7d-4c6a-9f0e-2d5b8a1c7e64
                      expiresIn: 604800
                      member:
                        id: '1'
                        memberNo: '620108173325'
                        nickname: Vivian
                        avatarUrl: ''
                        level: 2
                        points: 1280
                        balanceCent: 51200
                        giftBalanceCent: 1200
                        phoneBound: true
                        phoneMasked: '138****0817'
        '400':
          description: 参数缺失/格式错误/取值非法/幂等键非法（400xx）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResult'
              examples:
                paramMissing:
                  $ref: '#/components/examples/paramMissing'
                invalidFormat:
                  $ref: '#/components/examples/invalidFormat'
        '401':
          description: 认证失败（401xx：token 无效/过期/类型错误、微信登录失败、手机号解密失败）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResult'
              examples:
                wechatLoginFailed:
                  $ref: '#/components/examples/wechatLoginFailed'
        '429':
          description: 限流/防刷（429xx）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResult'
              examples:
                tooManyRequests:
                  $ref: '#/components/examples/tooManyRequests'
        '500':
          description: 服务端错误（500xx）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResult'
              examples:
                internalError:
                  $ref: '#/components/examples/internalError'
        '503':
          description: 依赖不可用/维护中（503xx）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResult'
              examples:
                wechatUnavailable:
                  $ref: '#/components/examples/wechatUnavailable'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginWechatReq'
