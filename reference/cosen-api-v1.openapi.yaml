                  $ref: '#/components/examples/memberDisabled'
                rechargeCampaignExpired:
                  $ref: '#/components/examples/rechargeCampaignExpired'
        '429':
          description: 限流/防刷（42904）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResult'
              examples:
                rateLimited:
                  $ref: '#/components/examples/rateLimited'
        '500':
          description: 服务端错误（500xx）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResult'
              examples:
                internalError:
                  $ref: '#/components/examples/internalError'
                consistencyError:
                  $ref: '#/components/examples/consistencyError'
        '502':
          description: 微信支付下单或回调验签失败（40922）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResult'
              examples:
                wechatPayFailed:
                  $ref: '#/components/examples/wechatPayFailed'
        '503':
          description: 依赖不可用/维护中（503xx）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResult'
              examples:
                wechatUnavailable:
                  $ref: '#/components/examples/wechatUnavailable'
                serviceUnavailable:
                  $ref: '#/components/examples/serviceUnavailable'
      security:
      - bearerAuth: []
  /app/recharges/{rechargeNo}:
    get:
      operationId: getRechargeByNo
      summary: 充值状态查询
      description: 只能查本人充值单；不存在或非本人统一返回 40407，防止充值单号枚举。
      tags:
      - app/充值
      parameters:
      - name: rechargeNo
        in: path
        required: true
        description: 充值单号，如 RC20261118000001
        schema:
          type: string
          pattern: '^RC[0-9]{14,20}$'
      responses:
        '403':
          description: 游客需要先通过微信验证手机号（40310）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResult'
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                description: 充值单
                allOf:
                - $ref: '#/components/schemas/AppResult'
                - type: object
                  properties:
                    data:
                      $ref: '#/components/schemas/RechargeOrder'
              examples:
                success:
                  summary: 充值已到账（充 500 赠 100）
                  value:
                    code: 200
                    msg: ok
                    traceId: c8f1e103
                    data:
                      rechargeNo: RC20261118000001
                      tierCode: TIER_500_100
                      campaignId: RC202611
                      amountCent: 50000
                      bonusCent: 10000
                      totalCent: 60000
                      payMode: wechat
                      status: paid
                      paidAt: '2026-11-18T00:12:31+08:00'
                      flowNo: BF20261118000001
                      balanceAfterCent: 61200
                      giftBalanceAfterCent: 11200
        '401':
          description: 认证失败（401xx：token 无效/过期/类型错误/已注销）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResult'
              examples:
                tokenMissing:
                  $ref: '#/components/examples/tokenMissing'
                tokenExpired:
                  $ref: '#/components/examples/tokenExpired'
                adminToken:
                  $ref: '#/components/examples/adminToken'
                tokenRevoked:
                  $ref: '#/components/examples/tokenRevoked'
        '404':
          description: 充值单不存在或不在本人名下（40407，防枚举）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResult'
              examples:
                rechargeNotFound:
                  $ref: '#/components/examples/rechargeNotFound'
        '409':
          description: 会员被停用（40901）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResult'
              examples:
                memberDisabled:
                  $ref: '#/components/examples/memberDisabled'
        '500':
          description: 服务端错误（500xx）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResult'
              examples:
                internalError:
                  $ref: '#/components/examples/internalError'
        '503':
          description: 依赖不可用/维护中（503xx）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResult'
              examples:
                serviceUnavailable:
                  $ref: '#/components/examples/serviceUnavailable'
      security:
      - bearerAuth: []

components:
  schemas:
    MemberProfile:
      type: object
      title: MemberProfile
      description: 会员侧对外脱敏模型，不含 openid/unionid/明文手机号/version/deleted
      properties:
        realName: {type: string, maxLength: 32, description: 会员选填姓名}
        id:
          type: string
          format: int64
          readOnly: true
          description: 会员ID（bigint ID，JSON 用字符串避免精度丢失）
        memberNo:
          type: string
          maxLength: 32
          description: 会员号（展示用）
        nickname:
          type: string
          maxLength: 64
          description: 昵称，可为空串
        avatarUrl:
          type: string
          maxLength: 512
          description: 头像，未设置为空串
        level:
          type: integer
          format: int32
          enum: [1, 2, 3]
          description: 1可森 2醇香 3深焙
        points:
          type: integer
          format: int32
          minimum: 0
          description: 积分
        balanceCent:
          type: integer
          format: int64
          minimum: 0
          description: 可用储值余额（分，含赠送）
        giftBalanceCent:
          type: integer
          format: int64
          minimum: 0
          description: 其中赠送部分（分，仅展示/对账）
        phoneBound:
          type: boolean
          description: 是否已绑定手机号
        phoneMasked:
          type: string
          pattern: '^(?:\d{3}\*{4}\d{4})?$'
          description: 脱敏手机号，如 138****0817；未绑定时为空串
      required:
      - id
      - memberNo
      - phoneBound
    Member:
      type: object
      title: Member
      description: 对应表 cosen_member（会员）。内部/后台模型，禁止直接用于 /app/** 响应
      x-internal: true
      properties:
        id:
          type: string
          format: int64
          description: 会员ID（bigint ID，JSON 用字符串避免精度丢失）
          readOnly: true
        memberNo:
          type: string
          maxLength: 32
          description: 会员号（展示用，如 6201 0817 3325）
        openid:
          type: string
          maxLength: 64
          description: 微信 openid（正式轨 code2session 获得）
        unionid:
          type: string
          maxLength: 64
          description: 微信 unionid（多端打通预留）
        phone:
          type: string
          maxLength: 20
          description: 手机号（微信手机号快速验证后绑定）
        nickname:
          type: string
          maxLength: 64
          description: 昵称
        avatarUrl:
          type: string
          maxLength: 512
          description: 头像
        gender:
          type: integer
          format: int32
          enum:
          - 0
          - 1
          - 2
          description: 0未知 1男 2女
        birthday:
          type: string
          format: date
          description: 生日（生日券）
        balanceCent:
          type: integer
          format: int64
          description: 可用储值余额（分，含赠送）（bigint，单位：分/计数）
        giftBalanceCent:
          type: integer
          format: int64
          description: 其中赠送部分（分，仅展示/对账）（bigint，单位：分/计数）
        points:
          type: integer
          format: int32
          description: 积分
        level:
          type: integer
          format: int32
          enum:
          - 1
          - 2
          - 3
          description: 1可森 2醇香 3深焙
        rechargeTotalCent:
          type: integer
          format: int64
          description: 累计实充（分，等级依据）（bigint，单位：分/计数）
        storeId:
          type: string
          format: int64
          description: 门店ID（单店模型，预留）（bigint ID，JSON 用字符串避免精度丢失）
        status:
          type: integer
          format: int32
          enum:
          - 1
          - 0
          description: 1正常 0停用
        loginType:
          type: string
          maxLength: 16
          description: 最近登录通道：wechat/mock（联调轨）
        lastLoginAt:
          type: string
          format: date-time
          description: 最近登录时间
        version:
          type: integer
          format: int32
          description: 乐观锁
        createTime:
          type: string
          format: date-time
          description: 创建时间
          readOnly: true
        updateTime:
          type: string
          format: date-time
          description: 更新时间
          readOnly: true
        deleted:
          type: integer
          format: int32
          description: 0正常 1删除
      x-table: cosen_member
      required:
      - memberNo
    MemberBalanceFlow:
      type: object
      title: MemberBalanceFlow
      description: 对应表 cosen_member_balance_flow（储值账本流水）
      properties:
        id:
          type: string
          format: int64
          description: 流水ID（bigint ID，JSON 用字符串避免精度丢失）
          readOnly: true
        flowNo:
          type: string
          maxLength: 40
          description: 流水号（幂等展示）
        memberId:
          type: string
          format: int64
          description: 会员ID（bigint ID，JSON 用字符串避免精度丢失）
        bizType:
          type: string
          enum:
          - RECHARGE
          - REWARD
          - CONSUME
          - REFUND
          - ADJUST
          - TRANSFER_IN
          - TRANSFER_OUT
          maxLength: 24
          description: RECHARGE/REWARD/CONSUME/REFUND/ADJUST/TRANSFER_IN/TRANSFER_OUT
        direction:
          type: integer
          format: int32
          description: 1入账 -1出账
        amountCent:
          type: integer
          format: int64
          description: 变动金额（分，带符号）（bigint，单位：分/计数）
        balanceBeforeCent:
          type: integer
          format: int64
          description: 变动前可用余额（分）（bigint，单位：分/计数）
        balanceAfterCent:
          type: integer
          format: int64
          description: 变动后可用余额（分）（bigint，单位：分/计数）
        relatedType:
          type: string
          enum:
          - ORDER
          - RECHARGE
          - COUPON
          - ADJUST
          maxLength: 24
          description: 关联单据类型：ORDER/RECHARGE/COUPON/ADJUST
        relatedId:
          type: string
          maxLength: 64
          description: 关联单号（order_no / coupon_no / 外部单号）
        remark:
          type: string
          maxLength: 255
          description: 备注
        createTime:
          type: string
          format: date-time
          description: 创建时间
          readOnly: true
      x-table: cosen_member_balance_flow
      required:
      - flowNo
      - memberId
      - bizType
      - direction
      - amountCent
      - balanceBeforeCent
      - balanceAfterCent
    Category:
      type: object
      title: Category
      description: 对应表 cosen_category（商品分类）
      properties:
        id:
          type: string
          format: int64
          description: 分类ID（bigint ID，JSON 用字符串避免精度丢失）
          readOnly: true
        code:
          type: string
          maxLength: 32
          pattern: '^[a-z0-9-]{1,32}$'
          description: 分类编码（前端 mock cat，如 matcha/craft）
        name:
          type: string
          maxLength: 32
          description: 中文名
        nameEn:
          type: string
          maxLength: 64
          description: 英文名
        description:
          type: string
          maxLength: 255
          description: 分类描述（菜单副标题）
        domain:
          type: string
          enum:
          - coffee
          - bar
          - other
          maxLength: 16
          description: 业务域：coffee/bar/other（日咖夜酒）
        sortNo:
          type: integer
          format: int32
          minimum: 0
          description: 排序，越小越前
      x-table: cosen_category
      required:
      - code
      - name
    Product:
      type: object
      title: Product
      description: 对应表 cosen_product（商品）
      properties:
        id:
          type: string
          format: int64
          description: 商品ID（bigint ID，JSON 用字符串避免精度丢失）
          readOnly: true
        code:
          type: string
          maxLength: 32
          pattern: '^[a-z0-9-]{1,32}$'
          description: 商品编码（前端 mock id，如 m1/craft-pale）
        categoryId:
          type: string
          format: int64
          description: 分类ID（bigint ID，JSON 用字符串避免精度丢失）
        coverUrl:
          type: string
          maxLength: 255
          description: 商品封面图（相册第一张）；相对 API 根的路径（如 /images/products/m1-0-3f2a1c9d.png），未上传图片时为空串
        gallery:
          type: array
          maxItems: 20
          items:
            type: string
            maxLength: 255
          description: 商品相册（轮播图组，按展示顺序，第一张即封面）；未上传图片时为空数组
        name:
          type: string
          maxLength: 64
          description: 商品名
        nameEn:
          type: string
          maxLength: 64
          description: 英文名
        description:
          type: string
          maxLength: 512
          description: 商品描述
        priceCent:
          type: integer
          format: int64
          minimum: 0
          description: 基础价（分）（bigint，单位：分/计数）
        rating:
          type: number
          format: double
          minimum: 0
          maximum: 10
          description: 评分 0.0-9.9
        soldCount:
          type: integer
          format: int32
          description: 累计销量（展示）
        badge:
          type: array
          items:
            type: string
            enum:
            - 招牌
            - 人气
            - 限定
            - 新品
            - 可森特调
          description: 角标（多选，来自 Base「推荐/新品标签」）：招牌/人气/限定/新品/可森特调；无角标时为空数组
        ingredientsJson:
          type: array
          items:
            type: string
          description: 原料清单数组
        specGroupsJson:
          type: array
          items:
            type: string
          description: 规格组 key 数组（size/ice/sugar/milk/extra）
        artJson:
          type: object
          additionalProperties: true
          description: 插画参数 DrinkArtSpec（键值对象）
        tileColorStart:
          type: string
          maxLength: 7
          description: '卡片渐变起始色 #RRGGBB'
        tileColorEnd:
          type: string
          maxLength: 7
          description: '卡片渐变结束色 #RRGGBB'
        stock:
          type: integer
          format: int32
          minimum: -1
          description: -1 不限库存，>=0 为剩余量（乐观锁扣减）
        status:
          type: integer
          format: int32
          enum:
          - 1
          - 0
          description: 1上架 0下架
        sortNo:
          type: integer
          format: int32
          description: 排序
      x-table: cosen_product
      required:
      - code
      - categoryId
      - name
    CouponUser:
      type: object
      title: CouponUser
      description: 对应表 cosen_coupon_user（用户礼品券背包）
      properties:
        id:
          type: string
          format: int64
          description: 用户券ID（bigint ID，JSON 用字符串避免精度丢失）
          readOnly: true
        couponNo:
          type: string
          maxLength: 40
          description: 券实例号
        title:
          type: string
          maxLength: 64
          description: 券标题（雨天暖心券…）
        type:
          type: string
          enum:
          - cash
          - discount
          - gift
          maxLength: 16
          description: cash 满减 / discount 折扣 / gift 赠品券（固定面额，到店核销，无兑换码）
        valueCent:
          type: integer
          format: int64
          description: cash/gift 面额（分）；discount 时为 NULL（bigint，单位：分/计数）
        discountRate:
          type: number
          format: double
          description: 折扣率，如 0.8500（仅 discount）
        thresholdCent:
          type: integer
          format: int64
          description: 门槛（分），0 无门槛（bigint，单位：分/计数）
        maxOffCent:
          type: integer
          format: int64
          description: 折扣券最高减（分）（bigint，单位：分/计数）
        issuer:
          type: string
          maxLength: 64
          description: 发放人/店
        reason:
          type: string
          maxLength: 255
          description: 发放理由
        startAt:
          type: string
          format: date-time
          description: 生效时间
        endAt:
          type: string
          format: date-time
          description: 失效时间
        status:
          type: string
          enum:
          - unused
          - used
          - expired
          - transferred
          - frozen
          maxLength: 16
          description: unused/used/expired/transferred/frozen
        usedAt:
          type: string
          format: date-time
          description: 核销时间
        orderId:
          type: string
          format: int64
          description: 核销订单ID（bigint ID，JSON 用字符串避免精度丢失）
        source:
          type: string
          enum:
          - grant
          - redeem
          - transfer
          maxLength: 16
          description: grant 后台发放 / redeem 积分或活动兑换发放 / transfer 好友转赠；redeem 仅表示发放来源，券仍无兑换码字段与兑换接口（红线不变）
        transferNo:
          type: string
          maxLength: 40
          description: 转赠单号
        transferAt:
          type: string
          format: date-time
          description: 转出时间
        acceptAt:
          type: string
          format: date-time
          description: 接收时间
        createTime:
          type: string
          format: date-time
          description: 创建时间
          readOnly: true
        updateTime:
          type: string
          format: date-time
          description: 更新时间
          readOnly: true
      x-table: cosen_coupon_user
      required:
      - couponNo
      - title
      - type
      - startAt
      - endAt
    Order:
      type: object
      title: Order
      description: 订单列表模型（脱敏，不含 memberId/version/idempotencyKey/updateTime）
      properties:
        id:
          type: string
          format: int64
          readOnly: true
          description: 订单ID（bigint ID，JSON 用字符串避免精度丢失）
        orderNo:
          type: string
          pattern: '^\d{16}$'
          maxLength: 32
          description: 订单号（16 位数字）
        pickupCode:
          type: string
          pattern: '^[A-Z]\d{3}$'
          maxLength: 8
          description: 取餐号，如 A018
        storeId:
          type: string
          format: int64
          description: 门店ID（单店阶段固定 1）
        fulfillType:
          type: string
          enum:
          - pickup
          maxLength: 16
          description: 履约方式：仅 pickup（到店自取，外送域已剔除）
        itemCount:
          type: integer
          format: int32
          minimum: 1
          description: 商品件数 = Σ items.qty
        subtotalCent:
          type: integer
          format: int64
          minimum: 0
          description: 商品小计（分）
        couponOffCent:
          type: integer
          format: int64
          minimum: 0
          description: 券抵扣（分）
        payableCent:
          type: integer
          format: int64
          minimum: 0
          description: 应付 = subtotalCent - couponOffCent（分）
        balancePayCent:
          type: integer
          format: int64
          minimum: 0
          description: 储值支付（分）
        wechatPayCent:
          type: integer
          format: int64
          minimum: 0
          description: 微信支付（分）
        couponId:
          type: string
          format: int64
          nullable: true
          description: 使用的用户券ID，未用券为 null
        payMode:
          type: string
          enum:
          - balance
          - wechat
          - mixed
          maxLength: 16
          description: balance 储值 / wechat 微信 / mixed 组合
        payStatus:
          type: string
          enum:
          - unpaid
          - paid
          - refunded
          - closed
          maxLength: 16
          description: 支付状态
        orderStatus:
          type: string
          enum:
          - created
          - paid
          - making
          - ready
          - completed
          - cancelled
          maxLength: 16
          description: 订单状态机
        remark:
          type: string
          maxLength: 255
          description: 备注
        createTime:
          type: string
          format: date-time
          readOnly: true
          description: 创建时间（ISO-8601 +08:00）
        paidAt:
          type: string
          format: date-time
          nullable: true
          description: 支付完成时间
        finishedAt:
          type: string
          format: date-time
          nullable: true
          description: 完成/取餐时间
        cancelledAt:
          type: string
          format: date-time
          nullable: true
          description: 取消时间
      required:
      - id
      - orderNo
      - fulfillType
      - payMode
      - payStatus
      - orderStatus
      - createTime
    OrderItem:
      type: object
      title: OrderItem
      description: 订单明细快照（不含 orderId/productId/createTime 等内部字段）
      properties:
        id:
          type: string
          format: int64
          readOnly: true
          description: 明细ID（bigint ID，JSON 用字符串避免精度丢失）
        productCode:
          type: string
          pattern: '^[a-z0-9-]{1,32}$'
          maxLength: 32
          description: 商品编码快照（m1…）
        productName:
          type: string
          maxLength: 64
          description: 商品名快照
        productNameEn:
          type: string
          maxLength: 64
          description: 英文名快照
        specText:
          type: string
          maxLength: 255
          description: 规格文案快照（大杯 / 少冰 / 少甜）
        specJson:
          type: object
          additionalProperties:
            type: string
          description: 规格选择快照（key -> option）
        unitPriceCent:
          type: integer
          format: int64
          minimum: 0
          description: 成交单价（分，含加料）
        qty:
          type: integer
          format: int32
          minimum: 1
          maximum: 99
          description: 数量（1..99）
        amountCent:
          type: integer
          format: int64
          minimum: 0
          description: 小计 = unitPriceCent * qty（分）
        artJson:
          type: object
          additionalProperties: true
          description: 插画快照（列表免二次查询）
      required:
      - id
      - productCode
      - productName
      - qty
      - unitPriceCent
      - amountCent
    AppResult:
      type: object
      title: AppResult
      description: 小程序端统一响应信封：code=200 成功
      properties:
        code:
          type: integer
          format: int32
          example: 200
        msg:
          type: string
          example: ok
        traceId:
          type: string
          description: 服务端链路 ID（每请求生成，12 位；成功与错误都带）
        data:
          type: object
          nullable: true
          additionalProperties: true
      required:
      - code
      - msg
      - traceId
    PageResult:
      type: object
      title: PageResult
      description: 分页信封：total + rows
      properties:
        code:
          type: integer
          format: int32
        msg:
          type: string
        total:
          type: integer
          format: int64
          description: 总条数（JSON 用字符串时按 string 处理）
        rows:
          type: array
          items:
            type: object
            additionalProperties: true
        traceId:
          type: string
          description: 服务端链路 ID（每请求生成，12 位；成功与错误都带）
      required:
      - code
      - rows
      - traceId
    LoginWechatReq:
      type: object
      title: LoginWechatReq
      properties:
        nickname: {type: string, maxLength: 32, description: 手机号认领时选填的共享昵称}
        realName: {type: string, maxLength: 32, description: 会员选填姓名}
        code:
          type: string
          maxLength: 128
          description: wx.login 返回的 code
        phoneCode:
          type: string
          maxLength: 128
          description: 可选：getPhoneNumber 的 code
      required:
      - code
    LoginMockReq:
      type: object
      title: LoginMockReq
      description: 仅 dev/test 可用；phone 必填，用于定位或自动建档
      required:
      - phone
      properties:
        phone:
          type: string
          pattern: '^1[3-9]\d{9}$'
          example: '13800000817'
          description: 大陆手机号（11 位）
        nickname:
          type: string
          maxLength: 64
          example: Vivian
          description: 可选昵称，缺省用「微信用户」
    BindPhoneReq:
      type: object
      title: BindPhoneReq
      properties:
        phoneCode:
          type: string
          maxLength: 128
          description: getPhoneNumber 返回的一次性 code
      required:
      - phoneCode
    LoginResp:
      type: object
      title: LoginResp
      properties:
        token:
          type: string
          description: 不透明 UUID，7 天有效，Redis 存 cosen:token:{token}
        expiresIn:
          type: integer
          format: int32
          example: 604800
        member:
          $ref: '#/components/schemas/MemberProfile'
      required:
      - token
      - expiresIn
      - member
    CreateOrderItemReq:
      type: object
      title: CreateOrderItemReq
      properties:
        productCode:
          type: string
          pattern: '^[a-z0-9-]{1,32}$'
          maxLength: 32
          example: m1
          description: 商品编码（m1/h1/f1/c1…）
        qty:
          type: integer
          minimum: 1
          maximum: 99
          example: 1
          description: 数量，1..99
        spec:
          type: object
          maxProperties: 8
          additionalProperties:
            type: string
          description: 规格选择，如 {"size":"大杯","temp":"少冰","sugar":"少甜","milk":"鲜牛奶"}
      required:
      - productCode
      - qty
    CreateOrderReq:
      type: object
      title: CreateOrderReq
      properties:
        items:
          type: array
          minItems: 1
          maxItems: 50
          description: 商品明细，1..50 项
          items:
            $ref: '#/components/schemas/CreateOrderItemReq'
        couponId:
          type: string
          maxLength: 40
          description: 可选：使用的用户券 couponNo，需属于本人且 unused
        payMode:
          type: string
          enum:
          - balance
          - wechat
          - mixed
          default: wechat
          description: 支付方式，默认 wechat
        remark:
          type: string
          maxLength: 255
          description: 备注
        idempotencyKey:
          type: string
          minLength: 8
          maxLength: 64
          description: 下单幂等键，与 Header Idempotency-Key 二选一必填；缺失/非法返回 40007
      required:
      - items
    PayOrderReq:
      type: object
      title: PayOrderReq
      properties:
        payMode:
          type: string
          enum:
          - balance
          - wechat
          - mixed
          description: 支付方式；mixed 时两个金额列均须 > 0
        balancePayCent:
          type: integer
          format: int64
          minimum: 0
          description: 储值支付（分）；mixed 时必须 > 0
        wechatPayCent:
          type: integer
          format: int64
          minimum: 0
          description: 微信支付（分）；mixed 时必须 > 0
      required:
      - payMode
    OrderDetail:
      type: object
      title: OrderDetail
      description: 订单 + 明细（显式展开字段，便于 Apifox/代码生成；不含 memberId/version/idempotencyKey）
      properties:
        id:
          type: string
          format: int64
          readOnly: true
          description: 订单ID（bigint ID，JSON 用字符串避免精度丢失）
        orderNo:
          type: string
          pattern: '^\d{16}$'
          maxLength: 32
          description: 订单号（16 位数字）
        pickupCode:
          type: string
          pattern: '^[A-Z]\d{3}$'
          maxLength: 8
          description: 取餐号，如 A018
        storeId:
          type: string
          format: int64
          description: 门店ID（单店阶段固定 1）
        fulfillType:
          type: string
          enum:
          - pickup
          maxLength: 16
          description: 履约方式：仅 pickup（到店自取）
        itemCount:
          type: integer
          format: int32
          minimum: 1
          description: 商品件数 = Σ items.qty
        subtotalCent:
          type: integer
          format: int64
          minimum: 0
          description: 商品小计（分）
        couponOffCent:
          type: integer
          format: int64
          minimum: 0
          description: 券抵扣（分）
        payableCent:
          type: integer
          format: int64
          minimum: 0
          description: 应付 = subtotalCent - couponOffCent（分）
        balancePayCent:
          type: integer
          format: int64
          minimum: 0
          description: 储值支付（分）；已支付时与 wechatPayCent 之和须等于 payableCent
        wechatPayCent:
          type: integer
          format: int64
          minimum: 0
          description: 微信支付（分）；已支付时与 balancePayCent 之和须等于 payableCent
        couponId:
          type: string
          format: int64
          nullable: true
          description: 使用的用户券ID，未用券为 null
        payMode:
          type: string
          enum:
          - balance
          - wechat
          - mixed
          maxLength: 16
          description: balance 储值 / wechat 微信 / mixed 组合
        payStatus:
          type: string
          enum:
          - unpaid
          - paid
          - refunded
          - closed
          maxLength: 16
          description: 支付状态
        orderStatus:
          type: string
          enum:
          - created
          - paid
          - making
          - ready
          - completed
          - cancelled
          maxLength: 16
          description: 订单状态机
        remark:
          type: string
          maxLength: 255
          description: 备注
        createTime:
          type: string
          format: date-time
          readOnly: true
          description: 创建时间（ISO-8601 +08:00）
        paidAt:
          type: string
          format: date-time
          nullable: true
          description: 支付完成时间
        finishedAt:
          type: string
          format: date-time
          nullable: true
          description: 完成/取餐时间
        cancelledAt:
          type: string
          format: date-time
          nullable: true
          description: 取消时间
        items:
          type: array
          minItems: 1
          maxItems: 50
          description: 订单明细，1..50 条
          items:
            $ref: '#/components/schemas/OrderItem'
      required:
      - id
      - orderNo
      - fulfillType
      - payMode
      - payStatus
      - orderStatus
      - createTime
      - items
    ErrorResult:
      type: object
      title: ErrorResult
      description: cosen /app 接口统一错误信封：code=业务码（见错误码规范），data=null，traceId=链路ID
      required:
      - code
      - msg
      - traceId
      properties:
        code:
          type: integer
          description: 业务码：200=成功；非 200 见错误码规范（40101/40405/40901/40903 等）
        msg:
          type: string
          description: 错误文案（面向用户/前端）
        data:
          type: object
          description: 错误时固定为 null
          nullable: true
        traceId:
          type: string
          description: 服务端链路 ID
    RechargeTier:
      type: object
      title: RechargeTier
      description: 充值档位（配置来源：环境配置 cosen.recharge.tiers；系统主，不同步 Base）
      properties:
        tierCode:
          type: string
          maxLength: 32
          pattern: '^TIER_[A-Z0-9_]{1,27}$'
          description: 档位编码，如 TIER_500_100
        name:
          type: string
          maxLength: 32
          description: 档位名（如 醇香储值）
        amountCent:
          type: integer
          format: int64
          minimum: 1
          description: 实充金额（分）
        bonusCent:
          type: integer
          format: int64
          minimum: 0
          description: 赠送金额（分）
        totalCent:
          type: integer
          format: int64
          minimum: 1
          description: 到账合计（分，实充+赠送）
        note:
          type: string
          maxLength: 32
          description: 展示文案（如 相当于 8.3 折）
        hot:
          type: boolean
          description: 是否推荐档位
        campaignId:
          type: string
          maxLength: 32
          description: 活动编码（环境配置）
        available:
          type: boolean
          description: 当前是否可购买（活动期/上下线）
      required:
      - tierCode
      - name
      - amountCent
      - bonusCent
      - totalCent
      - available
    WxPayParams:
      type: object
      title: WxPayParams
      description: 微信小程序支付拉起参数（仅创建充值单响应返回，勿缓存）
      properties:
        prepayId:
          type: string
          maxLength: 64
          description: 微信预支付 ID
        timeStamp:
          type: string
          maxLength: 16
          description: 秒级时间戳（字符串，避免 JS 精度丢失）
        nonceStr:
          type: string
          maxLength: 32
          description: 随机串
        package:
          type: string
          maxLength: 128
          description: 'prepay_id=xxx'
        signType:
          type: string
          enum:
          - RSA
          - HMAC-SHA256
          description: 签名算法
        paySign:
          type: string
          maxLength: 512
          description: 支付签名
      required:
      - prepayId
      - timeStamp
      - nonceStr
      - package
      - signType
      - paySign
    RechargeOrder:
      type: object
      title: RechargeOrder
      description: 充值单（对应表 cosen_recharge_order）；金额单位分，status 走 pending/paid/closed/failed
      properties:
        rechargeNo:
          type: string
          maxLength: 40
          pattern: '^RC[0-9]{14,20}$'
          description: 充值单号（微信 out_trade_no）
        tierCode:
          type: string
          maxLength: 32
          description: 档位编码
        campaignId:
          type: string
          maxLength: 32
          description: 活动编码
        amountCent:
          type: integer
          format: int64
          minimum: 1
          description: 实充金额（分）
        bonusCent:
          type: integer
          format: int64
          minimum: 0
          description: 赠送金额（分）
        totalCent:
          type: integer
          format: int64
          minimum: 1
          description: 到账合计（分）
        payMode:
          type: string
          enum:
          - wechat
          description: 第一切片固定 wechat
        status:
          type: string
          enum:
          - pending
          - paid
          - closed
          - failed
          description: pending 待支付 / paid 已到账 / closed 已关闭 / failed 支付失败
        failCode:
          type: integer
          format: int32
          description: 失败业务码（仅 status=failed 时有值，如 40922；成功/pending 时为 null）
        failMsg:
          type: string
          maxLength: 128
          description: 失败原因文案（仅 status=failed 时有值）
        expireAt:
          type: string
          format: date-time
          description: 支付超时时间（仅 pending 期间有意义）
        paidAt:
          type: string
          format: date-time
          description: 到账时间
        flowNo:
          type: string
          maxLength: 40
          description: 对应账本流水号（cosen_member_balance_flow.flow_no）
        balanceAfterCent:
          type: integer
          format: int64
          description: 到账后可用余额（分）
        giftBalanceAfterCent:
          type: integer
          format: int64
          description: 到账后赠送余额（分）
        wx:
          $ref: '#/components/schemas/WxPayParams'
      x-table: cosen_recharge_order
      required:
      - rechargeNo
      - tierCode
      - amountCent
      - bonusCent
      - totalCent
      - payMode
      - status

