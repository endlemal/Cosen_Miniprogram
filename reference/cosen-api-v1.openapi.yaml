openapi: 3.1.0
info:
  title: cosen 业务接口
  version: 0.1.0
  description: 可森小程序后端第一切片 API 契约（ETL 后的 DDL/model 对齐版），供 Apifox 审阅。后台管理接口见「RuoYi
    基础接口」模块。
servers:
- url: http://127.0.0.1:8080
  description: macbook 本机
tags:
- name: app/认证
  description: 微信登录 / 联调登录 / 手机号绑定
- name: app/会员
  description: 会员资料 / 储值余额 / 流水
- name: app/商品
  description: 分类 / 商品（点单）
- name: app/优惠券
  description: 券背包 / 券详情
- name: app/订单
  description: 下单 / 支付 / 查询 / 取消
paths:
  /app/auth/login/wechat:
    post:
      summary: 微信静默登录
      tags:
      - app/认证
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                description: 登录结果
                allOf:
                - $ref: '#/components/schemas/AppResult'
                - type: object
                  properties:
                    data:
                      $ref: '#/components/schemas/LoginResp'
        '400':
          $ref: '#/components/responses/ParamError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/ServerError'
        '503':
          $ref: '#/components/responses/Unavailable'
        default:
          $ref: '#/components/responses/ServerError'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginWechatReq'
  /app/auth/login/mock:
    post:
      summary: 联调一键登录（dev/test）
      tags:
      - app/认证
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                description: 登录结果
                allOf:
                - $ref: '#/components/schemas/AppResult'
                - type: object
                  properties:
                    data:
                      $ref: '#/components/schemas/LoginResp'
        '400':
          $ref: '#/components/responses/ParamError'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/ServerError'
        '503':
          $ref: '#/components/responses/Unavailable'
        default:
          $ref: '#/components/responses/ServerError'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginMockReq'
  /app/auth/phone/bind:
    post:
      summary: 绑定手机号
      tags:
      - app/认证
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                description: 会员信息
                allOf:
                - $ref: '#/components/schemas/AppResult'
                - type: object
                  properties:
                    data:
                      $ref: '#/components/schemas/Member'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '400':
          $ref: '#/components/responses/ParamError'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/ServerError'
        '503':
          $ref: '#/components/responses/Unavailable'
        default:
          $ref: '#/components/responses/ServerError'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BindPhoneReq'
      security: &id001
      - bearerAuth: []
  /app/auth/logout:
    post:
      summary: 注销 token
      tags:
      - app/认证
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppResult'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/ServerError'
        '503':
          $ref: '#/components/responses/Unavailable'
        default:
          $ref: '#/components/responses/ServerError'
      security: *id001
  /app/member/profile:
    get:
      summary: 会员资料 + 可用余额
      tags:
      - app/会员
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                description: 会员信息
                allOf:
                - $ref: '#/components/schemas/AppResult'
                - type: object
                  properties:
                    data:
                      $ref: '#/components/schemas/Member'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/ServerError'
        '503':
          $ref: '#/components/responses/Unavailable'
        default:
          $ref: '#/components/responses/ServerError'
      security: *id001
  /app/member/balance/flows:
    get:
      summary: 储值流水
      tags:
      - app/会员
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                allOf:
                - $ref: '#/components/schemas/PageResult'
                - type: object
                  properties:
                    rows:
                      type: array
                      items:
                        $ref: '#/components/schemas/MemberBalanceFlow'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '400':
          $ref: '#/components/responses/ParamError'
        '500':
          $ref: '#/components/responses/ServerError'
        '503':
          $ref: '#/components/responses/Unavailable'
        default:
          $ref: '#/components/responses/ServerError'
      parameters:
      - &id002
        name: pageNum
        in: query
        schema:
          type: integer
          default: 1
      - &id003
        name: pageSize
        in: query
        schema:
          type: integer
          default: 10
      security: *id001
  /app/catalog/categories:
    get:
      summary: 分类列表
      tags:
      - app/商品
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                description: 分类数组
                allOf:
                - $ref: '#/components/schemas/AppResult'
                - type: object
                  properties:
                    data:
                      type: array
                      items:
                        $ref: '#/components/schemas/Category'
        '500':
          $ref: '#/components/responses/ServerError'
        '503':
          $ref: '#/components/responses/Unavailable'
        default:
          $ref: '#/components/responses/ServerError'
  /app/catalog/products:
    get:
      summary: 商品列表
      tags:
      - app/商品
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                allOf:
                - $ref: '#/components/schemas/PageResult'
                - type: object
                  properties:
                    rows:
                      type: array
                      items:
                        $ref: '#/components/schemas/Product'
        '400':
          $ref: '#/components/responses/ParamError'
        '500':
          $ref: '#/components/responses/ServerError'
        '503':
          $ref: '#/components/responses/Unavailable'
        default:
          $ref: '#/components/responses/ServerError'
      parameters:
      - *id002
      - *id003
      - name: category
        in: query
        schema:
          type: string
        description: 分类 code，如 matcha
  /app/catalog/products/{code}:
    get:
      summary: 商品详情
      tags:
      - app/商品
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                description: 商品
                allOf:
                - $ref: '#/components/schemas/AppResult'
                - type: object
                  properties:
                    data:
                      $ref: '#/components/schemas/Product'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'
        '503':
          $ref: '#/components/responses/Unavailable'
        default:
          $ref: '#/components/responses/ServerError'
      parameters:
      - name: code
        in: path
        required: true
        schema:
          type: string
  /app/coupons:
    get:
      summary: 我的券背包
      tags:
      - app/优惠券
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                description: 券数组
                allOf:
                - $ref: '#/components/schemas/AppResult'
                - type: object
                  properties:
                    data:
                      type: array
                      items:
                        $ref: '#/components/schemas/CouponUser'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '400':
          $ref: '#/components/responses/ParamError'
        '500':
          $ref: '#/components/responses/ServerError'
        '503':
          $ref: '#/components/responses/Unavailable'
        default:
          $ref: '#/components/responses/ServerError'
      parameters:
      - name: status
        in: query
        schema:
          type: string
          enum:
          - unused
          - used
          - expired
          - transferred
          - frozen
      security: *id001
  /app/coupons/{couponNo}:
    get:
      summary: 券详情
      tags:
      - app/优惠券
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                description: 券
                allOf:
                - $ref: '#/components/schemas/AppResult'
                - type: object
                  properties:
                    data:
                      $ref: '#/components/schemas/CouponUser'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'
        '503':
          $ref: '#/components/responses/Unavailable'
        default:
          $ref: '#/components/responses/ServerError'
      parameters:
      - name: couponNo
        in: path
        required: true
        schema:
          type: string
      security: *id001
  /app/orders:
    post:
      summary: 创建订单（自取）
      tags:
      - app/订单
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                description: 订单详情
                allOf:
                - $ref: '#/components/schemas/AppResult'
                - type: object
                  properties:
                    data:
                      $ref: '#/components/schemas/OrderDetail'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '400':
          $ref: '#/components/responses/ParamError'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/ServerError'
        '503':
          $ref: '#/components/responses/Unavailable'
        default:
          $ref: '#/components/responses/ServerError'
      description: 幂等：Header Idempotency-Key 或 body.idempotencyKey；金额后端按商品价重算
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOrderReq'
      security: *id001
    get:
      summary: 我的订单列表
      tags:
      - app/订单
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                allOf:
                - $ref: '#/components/schemas/PageResult'
                - type: object
                  properties:
                    rows:
                      type: array
                      items:
                        $ref: '#/components/schemas/Order'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '400':
          $ref: '#/components/responses/ParamError'
        '500':
          $ref: '#/components/responses/ServerError'
        '503':
          $ref: '#/components/responses/Unavailable'
        default:
          $ref: '#/components/responses/ServerError'
      parameters:
      - *id002
      - *id003
      - name: orderStatus
        in: query
        schema:
          type: string
      security: *id001
  /app/orders/{orderNo}:
    get:
      summary: 订单详情
      tags:
      - app/订单
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                description: 订单详情
                allOf:
                - $ref: '#/components/schemas/AppResult'
                - type: object
                  properties:
                    data:
                      $ref: '#/components/schemas/OrderDetail'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'
        '503':
          $ref: '#/components/responses/Unavailable'
        default:
          $ref: '#/components/responses/ServerError'
      parameters:
      - name: orderNo
        in: path
        required: true
        schema:
          type: string
      security: *id001
  /app/orders/{orderNo}/pay:
    post:
      summary: 支付（储值/微信/组合）
      tags:
      - app/订单
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                description: 订单详情
                allOf:
                - $ref: '#/components/schemas/AppResult'
                - type: object
                  properties:
                    data:
                      $ref: '#/components/schemas/OrderDetail'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '400':
          $ref: '#/components/responses/ParamError'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/ServerError'
        '503':
          $ref: '#/components/responses/Unavailable'
        default:
          $ref: '#/components/responses/ServerError'
      parameters:
      - name: orderNo
        in: path
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PayOrderReq'
      security: *id001
  /app/orders/{orderNo}/cancel:
    post:
      summary: 取消订单
      tags:
      - app/订单
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                description: 订单详情
                allOf:
                - $ref: '#/components/schemas/AppResult'
                - type: object
                  properties:
                    data:
                      $ref: '#/components/schemas/OrderDetail'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/ServerError'
        '503':
          $ref: '#/components/responses/Unavailable'
        default:
          $ref: '#/components/responses/ServerError'
      parameters:
      - name: orderNo
        in: path
        required: true
        schema:
          type: string
      security: *id001
components:
  schemas:
    Member:
      type: object
      title: Member
      description: 对应表 cosen_member（会员）
      properties:
        id:
          type: string
          format: int64
          description: 会员ID（bigint ID，JSON 用字符串避免精度丢失）
          readOnly: true
        memberNo:
          type: string
          maxLength: 32
          description: 会员号（展示用，如 6201 0817 3325）
        openid:
          type: string
          maxLength: 64
          description: 微信 openid（正式轨 code2session 获得）
        unionid:
          type: string
          maxLength: 64
          description: 微信 unionid（多端打通预留）
        phone:
          type: string
          maxLength: 20
          description: 手机号（微信手机号快速验证后绑定）
        nickname:
          type: string
          maxLength: 64
          description: 昵称
        avatarUrl:
          type: string
          maxLength: 512
          description: 头像
        gender:
          type: integer
          format: int32
          enum:
          - 0
          - 1
          - 2
          description: 0未知 1男 2女
        birthday:
          type: string
          format: date
          description: 生日（生日券）
        balanceCent:
          type: integer
          format: int64
          description: 可用储值余额（分，含赠送）（bigint，单位：分/计数）
        giftBalanceCent:
          type: integer
          format: int64
          description: 其中赠送部分（分，仅展示/对账）（bigint，单位：分/计数）
        points:
          type: integer
          format: int32
          description: 积分
        level:
          type: integer
          format: int32
          enum:
          - 1
          - 2
          - 3
          description: 1可森 2醇香 3深焙
        rechargeTotalCent:
          type: integer
          format: int64
          description: 累计实充（分，等级依据）（bigint，单位：分/计数）
        storeId:
          type: string
          format: int64
          description: 门店ID（单店模型，预留）（bigint ID，JSON 用字符串避免精度丢失）
        status:
          type: integer
          format: int32
          enum:
          - 1
          - 0
          description: 1正常 0停用
        loginType:
          type: string
          maxLength: 16
          description: 最近登录通道：wechat/mock（联调轨）
        lastLoginAt:
          type: string
          format: date-time
          description: 最近登录时间
        version:
          type: integer
          format: int32
          description: 乐观锁
        createTime:
          type: string
          format: date-time
          description: 创建时间
          readOnly: true
        updateTime:
          type: string
          format: date-time
          description: 更新时间
          readOnly: true
        deleted:
          type: integer
          format: int32
          description: 0正常 1删除
      x-table: cosen_member
      required:
      - memberNo
    MemberBalanceFlow:
      type: object
      title: MemberBalanceFlow
      description: 对应表 cosen_member_balance_flow（储值账本流水）
      properties:
        id:
          type: string
          format: int64
          description: 流水ID（bigint ID，JSON 用字符串避免精度丢失）
          readOnly: true
        flowNo:
          type: string
          maxLength: 40
          description: 流水号（幂等展示）
        memberId:
          type: string
          format: int64
          description: 会员ID（bigint ID，JSON 用字符串避免精度丢失）
        bizType:
          type: string
          enum:
          - RECHARGE
          - REWARD
          - CONSUME
          - REFUND
          - ADJUST
          - TRANSFER_IN
          - TRANSFER_OUT
          maxLength: 24
          description: RECHARGE/REWARD/CONSUME/REFUND/ADJUST/TRANSFER_IN/TRANSFER_OUT
        direction:
          type: integer
          format: int32
          description: 1入账 -1出账
        amountCent:
          type: integer
          format: int64
          description: 变动金额（分，带符号）（bigint，单位：分/计数）
        balanceBeforeCent:
          type: integer
          format: int64
          description: 变动前可用余额（分）（bigint，单位：分/计数）
        balanceAfterCent:
          type: integer
          format: int64
          description: 变动后可用余额（分）（bigint，单位：分/计数）
        relatedType:
          type: string
          enum:
          - ORDER
          - RECHARGE
          - COUPON
          - ADJUST
          maxLength: 24
          description: 关联单据类型：ORDER/RECHARGE/COUPON/ADJUST
        relatedId:
          type: string
          maxLength: 64
          description: 关联单号（order_no / coupon_no / 外部单号）
        idempotencyKey:
          type: string
          maxLength: 64
          description: 幂等键（同一业务只记一次账）
        remark:
          type: string
          maxLength: 255
          description: 备注
        createTime:
          type: string
          format: date-time
          description: 创建时间
          readOnly: true
      x-table: cosen_member_balance_flow
      required:
      - flowNo
      - memberId
      - bizType
      - direction
      - amountCent
      - balanceBeforeCent
      - balanceAfterCent
    Category:
      type: object
      title: Category
      description: 对应表 cosen_category（商品分类）
      properties:
        id:
          type: string
          format: int64
          description: 分类ID（bigint ID，JSON 用字符串避免精度丢失）
          readOnly: true
        code:
          type: string
          maxLength: 32
          description: 分类编码（前端 mock cat，如 matcha/craft）
        name:
          type: string
          maxLength: 32
          description: 中文名
        nameEn:
          type: string
          maxLength: 64
          description: 英文名
        description:
          type: string
          maxLength: 255
          description: 分类描述（菜单副标题）
        domain:
          type: string
          enum:
          - coffee
          - bar
          - other
          maxLength: 16
          description: 业务域：coffee/bar/other（日咖夜酒）
        sortNo:
          type: integer
          format: int32
          description: 排序，越小越前
        status:
          type: integer
          format: int32
          enum:
          - 1
          - 0
          description: 1上架 0下架
        createTime:
          type: string
          format: date-time
          description: 创建时间
          readOnly: true
        updateTime:
          type: string
          format: date-time
          description: 更新时间
          readOnly: true
      x-table: cosen_category
      required:
      - code
      - name
    Product:
      type: object
      title: Product
      description: 对应表 cosen_product（商品）
      properties:
        id:
          type: string
          format: int64
          description: 商品ID（bigint ID，JSON 用字符串避免精度丢失）
          readOnly: true
        code:
          type: string
          maxLength: 32
          description: 商品编码（前端 mock id，如 m1/craft-pale）
        categoryId:
          type: string
          format: int64
          description: 分类ID（bigint ID，JSON 用字符串避免精度丢失）
        name:
          type: string
          maxLength: 64
          description: 商品名
        nameEn:
          type: string
          maxLength: 64
          description: 英文名
        description:
          type: string
          maxLength: 512
          description: 商品描述
        priceCent:
          type: integer
          format: int64
          description: 基础价（分）（bigint，单位：分/计数）
        rating:
          type: number
          format: double
          description: 评分 0.0-9.9
        soldCount:
          type: integer
          format: int32
          description: 累计销量（展示）
        badge:
          type: string
          maxLength: 16
          description: 角标：招牌/人气/限定/新品
        ingredientsJson:
          type: object
          additionalProperties: true
          description: 原料数组 JSON（JSON 对象/数组，按原结构透传）
        specGroupsJson:
          type: object
          additionalProperties: true
