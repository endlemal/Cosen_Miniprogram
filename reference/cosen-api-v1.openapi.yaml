      properties:
        code:
          type: integer
          format: int32
        msg:
          type: string
        total:
          type: integer
          format: int64
          description: 总条数（JSON 用字符串时按 string 处理）
        rows:
          type: array
          items:
            type: object
            additionalProperties: true
      required:
      - code
      - rows
    LoginWechatReq:
      type: object
      title: LoginWechatReq
      properties:
        code:
          type: string
          description: wx.login 返回的 code
        phoneCode:
          type: string
          description: 可选：getPhoneNumber 的 code
      required:
      - code
    LoginMockReq:
      type: object
      title: LoginMockReq
      description: 仅 dev/test 可用
      properties:
        phone:
          type: string
          example: '13800000817'
        nickname:
          type: string
          example: Vivian
    BindPhoneReq:
      type: object
      title: BindPhoneReq
      properties:
        phoneCode:
          type: string
      required:
      - phoneCode
    LoginResp:
      type: object
      title: LoginResp
      properties:
        token:
          type: string
          description: 不透明 UUID，7 天有效，Redis 存 cosen:token:{token}
        expiresIn:
          type: integer
          format: int32
          example: 604800
        member:
          $ref: '#/components/schemas/Member'
      required:
      - token
      - expiresIn
      - member
    CreateOrderItemReq:
      type: object
      title: CreateOrderItemReq
      properties:
        productCode:
          type: string
          example: m1
        qty:
          type: integer
          minimum: 1
          example: 1
        spec:
          type: object
          additionalProperties:
            type: string
          description: 规格选择，如 {"size":"大杯","ice":"少冰"}
      required:
      - productCode
      - qty
    CreateOrderReq:
      type: object
      title: CreateOrderReq
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/CreateOrderItemReq'
        couponId:
          type: string
          description: 可选：使用的用户券 coupon_no/id
        payMode:
          type: string
          enum:
          - balance
          - wechat
          - mixed
          default: wechat
        remark:
          type: string
          maxLength: 255
        idempotencyKey:
          type: string
          description: 客户端 UUID，服务端 uk_idem_key 兜底
      required:
      - items
    PayOrderReq:
      type: object
      title: PayOrderReq
      properties:
        payMode:
          type: string
          enum:
          - balance
          - wechat
          - mixed
        balancePayCent:
          type: integer
          format: int64
          description: 储值支付（分）
        wechatPayCent:
          type: integer
          format: int64
          description: 微信支付（分）
      required:
      - payMode
    OrderDetail:
      type: object
      title: OrderDetail
      description: 订单 + 明细（列表/详情共用）
      allOf:
      - $ref: '#/components/schemas/Order'
      - type: object
        properties:
          items:
            type: array
            items:
              $ref: '#/components/schemas/OrderItem'
    ErrorResult:
      type: object
      title: ErrorResult
      description: cosen /app 接口统一错误信封：code=业务码（见错误码规范），data=null，traceId=链路ID
      required:
      - code
      - msg
      - traceId
      properties:
        code:
          type: integer
          description: 业务码：200=成功；非 200 见错误码规范（40101/40405/40901/40903 等）
        msg:
          type: string
          description: 错误文案（面向用户/前端）
        data:
          type: object
          description: 错误时固定为 null
          nullable: true
        traceId:
          type: string
          description: 服务端链路 ID
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: UUID
  responses:
    ParamError:
      description: 参数缺失/格式错误/取值非法/幂等键非法（400xx）
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResult'
          examples:
            paramMissing:
              summary: 缺少必填参数
              value:
                code: 40001
                msg: 缺少必填参数
                data: null
                traceId: c8f1d2e3
            paramInvalid:
              summary: 参数格式/枚举非法
              value:
                code: 40003
                msg: 参数取值不合法
                data: null
                traceId: c8f1d2e4
    Unauthorized:
      description: 认证失败（401xx：token 无效/过期/类型错误、微信登录失败、手机号解密失败）
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResult'
          examples:
            tokenMissing:
              summary: 未登录
              value:
                code: 40101
                msg: 请先登录
                data: null
                traceId: c8f1d2e5
            tokenExpired:
              summary: token 过期
              value:
                code: 40104
                msg: 登录已过期，请重新登录
                data: null
                traceId: c8f1d2e6
            adminToken:
              summary: token 类型错误
              value:
                code: 40105
                msg: 登录状态无效，请重新登录
                data: null
                traceId: c8f1d2e7
    Forbidden:
      description: 越权/功能未启用/账号受限（403xx）
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResult'
          examples:
            noPermission:
              summary: 越权访问
              value:
                code: 40301
                msg: 无权访问该资源
                data: null
                traceId: c8f1d2e8
            mockDisabled:
              summary: mock 登录未启用
              value:
                code: 40302
                msg: 当前环境未开启联调登录
                data: null
                traceId: c8f1d2e9
    NotFound:
      description: 资源不存在（404xx）
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResult'
          examples:
            productNotFound:
              summary: 商品不存在
              value:
                code: 40401
                msg: 商品不存在或已下架
                data: null
                traceId: c8f1d2ea
            orderNotFound:
              summary: 订单不存在
              value:
                code: 40404
                msg: 订单不存在
                data: null
                traceId: c8f1d2eb
            memberNotFound:
              summary: 会员不存在
              value:
                code: 40405
                msg: 会员不存在，请重新登录
                data: null
                traceId: c8f1d2ec
    Conflict:
      description: 业务冲突/状态不允许（409xx）
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResult'
          examples:
            balanceNotEnough:
              summary: 余额不足
              value:
                code: 40903
                msg: 余额不足
                data: null
                traceId: c8f1d2ed
            couponUnavailable:
              summary: 券不可用
              value:
                code: 40907
                msg: 该券当前不可用
                data: null
                traceId: c8f1d2ee
            orderStatusInvalid:
              summary: 订单状态不允许
              value:
                code: 40916
                msg: 当前订单状态不允许该操作
                data: null
                traceId: c8f1d2ef
            memberDisabled:
              summary: 会员被停用
              value:
                code: 40901
                msg: 会员已被停用，请联系门店
                data: null
                traceId: c8f1d2f0
    RateLimited:
      description: 限流/防刷（429xx）
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResult'
          examples:
            tooManyRequests:
              summary: 请求过于频繁
              value:
                code: 42901
                msg: 操作过于频繁，请稍后重试
                data: null
                traceId: c8f1d2f1
    ServerError:
      description: 服务端错误（500xx）
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResult'
          examples:
            internalError:
              summary: 服务器内部错误
              value:
                code: 50001
                msg: 服务开小差了，请稍后重试
                data: null
                traceId: c8f1d2f2
    Unavailable:
      description: 依赖不可用/维护中（503xx）
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResult'
          examples:
            serviceUnavailable:
              summary: 依赖不可用
              value:
                code: 50302
                msg: 系统繁忙，请稍后重试
                data: null
                traceId: c8f1d2f3
