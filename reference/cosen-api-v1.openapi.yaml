openapi: 3.1.0
info:
  title: cosen 业务接口
  version: 1.7.1
  description: 可森小程序后端第一切片 API 契约（ETL 后的 DDL/model 对齐版），供 Apifox 审阅。后台管理接口见「RuoYi 基础接口」模块。v1.1.0：按飞书多维表格口径对齐，Product.badge
    改为多选数组（招牌/人气/限定/新品/可森特调），CouponUser.source 枚举补 redeem（积分或活动兑换发放）；接口路径、参数、错误码语义不变。v1.2.0：错误码响应示例对齐 error-codes.md v1.0.0（新增
    40106/40002/42902/50002/50301 与券冲突 40908–40910 示例，修正 40002 与 40003、42901 与 42902 的误用），接口路径、参数与错误码语义不变。v1.3.0：充值纳入第一切片，新增
    3 个接口（档位列表 / 创建充值单 / 状态查询）、RechargeTier/RechargeOrder/WxPayParams 模型、40407 充值单不存在或非本人，以及 40904/40905/40906/42904 示例；既有
    16 个接口不变。v1.4.0：成功响应补齐 traceId（AppResult/PageResult required + 19 个 200 示例），RechargeOrder 增加可选 failCode/failMsg，充值创建 409
    移除回调专属 40906，products 的 category 参数明确为分类 code（非分类 ID）；接口路径与参数不变。v1.4.1：修正 40921 挂载（pay 专属，HTTP 400），从 POST /app/orders
    的 409 移除。v1.5.0：Product 增加 coverUrl（相册第一张，相对路径）与 gallery（相册图片数组，第一张即封面）；商品图片由 Base「商品相册」附件同步落地为静态资源；既有接口路径与参数不变。v1.6.0：补齐
    GET /app/store（含门店营业状态、squareEnabled 与分场景微信订阅消息模板 subscribeTemplateIds/subscribeTemplates）及 POST /app/orders/{orderNo}/subscribe（上报并落库微信一次性订阅消息
    accept 授权结果，用于支付成功/取餐完成/退款结果推送）。v1.6.1：新增消费成功通知电子小票场景 orderReceipt（后台人工确认并携带最多 20 字自定义备注下发）。v1.6.2：新增 POST /app/member/subscribe
    会员级微信订阅消息额度上报接口（用于「我的」页开启小票通知、充值提交及勾选「总是保持」后的零弹窗静默攒次数，供后台代客下单等场景发送电子小票）。 v1.7.0：按实时实现补齐资料更新、退款、评价、反馈、当前微信身份注销、门店收款及扫码入口；补齐微信支付参数、退款状态与订单字段、40310、soldOut
    和 OAS 3.1 可空类型。文档覆盖不等于生产写链路验收，头像目前仅保存 URL，暂无小程序上传闭环。v1.7.1：小程序下线「注销账号」，只保留退出登录；POST /app/account/close 保留为旧客户端兼容，仅清当前 token，不再解绑微信或关闭会员。
servers:
- url: http://127.0.0.1:8080
  description: macbook 本机
tags:
- name: app/认证
  description: 微信登录 / 联调登录 / 手机号绑定
- name: app/门店
  description: 门店公开信息 / 营业状态 / 微信订阅消息模板配置
- name: app/会员
  description: 会员资料 / 储值余额 / 流水
- name: app/商品
  description: 分类 / 商品（点单）
- name: app/优惠券
  description: 券背包 / 券详情
- name: app/订单
  description: 下单 / 支付 / 查询 / 取消
- name: app/充值
  description: 储值档位 / 创建充值单 / 充值状态查询
- name: app/订单评价
- name: app/反馈
- name: app/账号
- name: app/门店收款
- name: app/门店入口
paths:
  /app/auth/login/wechat:
    post:
      operationId: loginByWechat
      summary: 微信登录与手机号认领
      description: 无 phoneCode 时使用当前微信静默建立会话，游客可微信支付下单；有 phoneCode 时仅接受微信服务端验证的号码。同号自动认领或共用会员余额、券及会员资料。付款使用本次会话的微信身份。
      tags:
      - app/认证
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                description: 登录结果
                allOf:
                - $ref: '#/components/schemas/AppResult'
                - type: object
                  properties:
                    data:
                      $ref: '#/components/schemas/LoginResp'
              examples:
                success:
                  summary: 微信静默登录成功（已绑定会员）
                  value:
                    traceId: c8f1e001
                    code: 200
                    msg: ok
                    data:
                      token: 3f1c9a2e-8b7d-4c6a-9f0e-2d5b8a1c7e64
                      expiresIn: 604800
                      member:
                        id: '1'
                        memberNo: '620108173325'
                        nickname: Vivian
                        avatarUrl: ''
                        level: 2
                        points: 1280
                        balanceCent: 51200
                        giftBalanceCent: 1200
                        phoneBound: true
                        phoneMasked: 138****0817
        '400':
          description: 参数缺失/格式错误/取值非法/幂等键非法（400xx）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResult'
              examples:
                paramMissing:
                  $ref: '#/components/examples/paramMissing'
                invalidFormat:
                  $ref: '#/components/examples/invalidFormat'
        '401':
          description: 认证失败（401xx：token 无效/过期/类型错误、微信登录失败、手机号解密失败）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResult'
              examples:
                wechatLoginFailed:
                  $ref: '#/components/examples/wechatLoginFailed'
        '429':
          description: 限流/防刷（429xx）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResult'
              examples:
                tooManyRequests:
                  $ref: '#/components/examples/tooManyRequests'
        '500':
          description: 服务端错误（500xx）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResult'
              examples:
                internalError:
                  $ref: '#/components/examples/internalError'
        '503':
          description: 依赖不可用/维护中（503xx）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResult'
              examples:
                wechatUnavailable:
                  $ref: '#/components/examples/wechatUnavailable'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginWechatReq'
      security: []
  /app/auth/login/mock:
    post:
      operationId: loginByMock
      summary: 联调一键登录（dev/test）
      tags:
      - app/认证
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                description: 登录结果
                allOf:
                - $ref: '#/components/schemas/AppResult'
                - type: object
                  properties:
                    data:
                      $ref: '#/components/schemas/LoginResp'
              examples:
                success:
                  summary: 联调账号登录成功
                  value:
                    traceId: c8f1e002
                    code: 200
                    msg: ok
                    data:
                      token: 3f1c9a2e-8b7d-4c6a-9f0e-2d5b8a1c7e64
                      expiresIn: 604800
                      member:
                        id: '1'
                        memberNo: '620108173325'
                        nickname: Vivian
                        avatarUrl: ''
                        level: 2
                        points: 1280
                        balanceCent: 51200
                        giftBalanceCent: 1200
                        phoneBound: true
                        phoneMasked: 138****0817
        '400':
          description: 参数缺失/格式错误/取值非法/幂等键非法（400xx）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResult'
              examples:
                paramMissing:
                  $ref: '#/components/examples/paramMissing'
                invalidFormat:
                  $ref: '#/components/examples/invalidFormat'
        '403':
          description: 越权/功能未启用/账号受限（403xx）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResult'
              examples:
                mockDisabled:
                  $ref: '#/components/examples/mockDisabled'
        '429':
          description: 限流/防刷（429xx）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResult'
              examples:
                tooManyRequests:
                  $ref: '#/components/examples/tooManyRequests'
        '500':
          description: 服务端错误（500xx）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResult'
              examples:
                internalError:
                  $ref: '#/components/examples/internalError'
        '503':
          description: 依赖不可用/维护中（503xx）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResult'
              examples:
                serviceUnavailable:
                  $ref: '#/components/examples/serviceUnavailable'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginMockReq'
      security: []
  /app/auth/phone/bind:
    post:
      operationId: bindPhone
      summary: 验证手机号并认领会员
      description: 只接受微信手机号授权码。同号自动共用会员，当前微信后续请求定位至已认领会员。
      tags:
      - app/认证
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                description: 会员信息
                allOf:
                - $ref: '#/components/schemas/AppResult'
                - type: object
                  properties:
                    data:
                      $ref: '#/components/schemas/MemberProfile'
              examples:
                success:
                  summary: 绑定成功，返回最新会员资料
                  value:
                    traceId: c8f1e003
                    code: 200
                    msg: ok
                    data:
                      id: '1'
                      memberNo: '620108173325'
                      nickname: Vivian
                      avatarUrl: ''
                      level: 2
                      points: 1280
                      balanceCent: 51200
                      giftBalanceCent: 1200
                      phoneBound: true
                      phoneMasked: 138****0817
        '401':
          description: 认证失败（401xx：token 无效/过期/类型错误/已注销、微信登录失败、手机号解密失败）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResult'
              examples:
                tokenMissing:
                  $ref: '#/components/examples/tokenMissing'
                tokenExpired:
                  $ref: '#/components/examples/tokenExpired'
                adminToken:
                  $ref: '#/components/examples/adminToken'
                tokenRevoked:
                  $ref: '#/components/examples/tokenRevoked'
                phoneDecryptFailed:
                  $ref: '#/components/examples/phoneDecryptFailed'
        '400':
          description: 参数缺失/格式错误/取值非法/幂等键非法（400xx）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResult'
              examples:
                paramMissing:
                  $ref: '#/components/examples/paramMissing'
                invalidFormat:
                  $ref: '#/components/examples/invalidFormat'
        '409':
          description: 业务冲突/状态不允许（409xx）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResult'
              examples:
                memberDisabled:
                  $ref: '#/components/examples/memberDisabled'
                phoneAlreadyBound:
                  $ref: '#/components/examples/phoneAlreadyBound'
        '500':
          description: 服务端错误（500xx）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResult'
              examples:
                internalError:
                  $ref: '#/components/examples/internalError'
        '503':
          description: 依赖不可用/维护中（503xx）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResult'
              examples:
                serviceUnavailable:
                  $ref: '#/components/examples/serviceUnavailable'
                wechatUnavailable:
                  $ref: '#/components/examples/wechatUnavailable'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BindPhoneReq'
      security: &id001
      - bearerAuth: []
  /app/auth/logout:
    post:
      operationId: logout
      summary: 注销 token
      tags:
      - app/认证
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppResult'
              examples:
                success:
                  summary: 注销成功（幂等）
                  value:
                    traceId: c8f1e004
                    code: 200
                    msg: ok
                    data: null
        '401':
          description: 认证失败（401xx：token 无效/过期/类型错误、微信登录失败、手机号解密失败）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResult'
              examples:
                tokenMissing:
                  $ref: '#/components/examples/tokenMissing'
                adminToken:
                  $ref: '#/components/examples/adminToken'
        '500':
          description: 服务端错误（500xx）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResult'
              examples:
                internalError:
                  $ref: '#/components/examples/internalError'
        '503':
          description: 依赖不可用/维护中（503xx）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResult'
              examples:
                serviceUnavailable:
                  $ref: '#/components/examples/serviceUnavailable'
      security: *id001
  /app/member/profile:
    get:
      operationId: getMemberProfile
      summary: 获取当前会员资料
      description: 游客资料不含可消费资产；已认领微信共享会员资料、昵称、姓名、余额和券。
      tags:
      - app/会员
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                description: 会员信息
                allOf:
                - $ref: '#/components/schemas/AppResult'
                - type: object
                  properties:
                    data:
                      $ref: '#/components/schemas/MemberProfile'
              examples:
                success:
                  summary: 会员资料示例
                  value:
                    traceId: c8f1e005
                    code: 200
                    msg: ok
                    data:
                      id: '1'
                      memberNo: '620108173325'
                      nickname: Vivian
                      avatarUrl: ''
                      level: 2
                      points: 1280
                      balanceCent: 51200
                      giftBalanceCent: 1200
                      phoneBound: true
                      phoneMasked: 138****0817
        '401':
          description: 认证失败（401xx：token 无效/过期/类型错误/已注销、微信登录失败、手机号解密失败）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResult'
              examples:
                tokenMissing:
                  $ref: '#/components/examples/tokenMissing'
                tokenExpired:
                  $ref: '#/components/examples/tokenExpired'
                adminToken:
                  $ref: '#/components/examples/adminToken'
                tokenRevoked:
                  $ref: '#/components/examples/tokenRevoked'
        '404':
          description: 资源不存在（404xx）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResult'
              examples:
                memberNotFound:
                  $ref: '#/components/examples/memberNotFound'
        '409':
          description: 业务冲突/状态不允许（409xx）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResult'
              examples:
                memberDisabled:
                  $ref: '#/components/examples/memberDisabled'
        '500':
          description: 服务端错误（500xx）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResult'
              examples:
                internalError:
                  $ref: '#/components/examples/internalError'
        '503':
          description: 依赖不可用/维护中（503xx）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResult'
              examples:
                serviceUnavailable:
                  $ref: '#/components/examples/serviceUnavailable'
      security: *id001
    put:
      operationId: updateMyMemberProfile
      summary: 修改昵称或头像 URL
      tags:
      - app/会员
      description: '登录身份（包括游客）可修改资料。nickname 与 avatarUrl 至少一个非 null；传入字符串先 trim。

        nickname 去空白后非空且不超过 32 字符，avatarUrl 去空白后不超过 500 字符，可用空串清除。

        phone 非 null 一律拒绝，请使用微信手机号绑定接口；realName 不属于此更新 DTO。

        此接口仅存储 URL 字符串，不上传图片、不将微信临时路径转换为永久 URL，不能替代文件上传。

        '
      security: &id002
      - bearerAuth: []
      requestBody: &id003
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateMemberProfileReq'
            example:
              nickname: 微信用户
              avatarUrl: https://example.com/avatar.png
      responses: &id004
        '200':
          description: 更新后的会员资料（AppResult 信封）
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/AppResult'
                - type: object
                  properties:
                    data:
                      $ref: '#/components/schemas/MemberProfile'
                  required:
                  - data
        '400': &id007
          description: 参数缺失或非法（40001/40002/40003；各接口详见描述）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResult'
              example:
                code: 40002
                msg: 参数格式错误
                data: null
                traceId: example00001
        '401': &id008
          description: 登录缺失/失败、过期、类型错误、撤销或账号已注销（40101/40102/40104/40105/40106/40108；依接口适用）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResult'
              example:
                code: 40101
                msg: 请先登录
                data: null
                traceId: example00002
        '404':
          description: 会员不存在（40405）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResult'
        '409':
          description: 会员已停用（40901）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResult'
        '500': &id009
          description: 服务端错误（50001）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResult'
        '503': &id010
          description: 数据库或 Redis 等依赖不可用（50302）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResult'
    post:
      operationId: updateMyMemberProfileCompat
      summary: 修改资料（POST 兼容别名）
      tags:
      - app/会员
      description: 与 PUT /app/member/profile 调用同一实现，仅为兼容别名，不代表新增业务能力；新调用建议使用 PUT。
      security: *id002
      requestBody: *id003
      responses: *id004
  /app/member/avatar:
    post:
      operationId: uploadMemberAvatar
      summary: 上传并持久化当前会员头像
      description: 小程序通过 chooseAvatar 获取微信临时头像后，以 multipart/form-data（字段 file）上传；服务端校验真实图像格式、限制 2 MB、等比缩放至最大 512px JPEG 落盘至 media/avatars 并更新 avatar_url，返回最新 MemberProfile（avatarUrl 为相对路径 /images/avatars/...）。
      tags:
      - app/会员
      security: *id002
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
              - file
              properties:
                file:
                  type: string
                  format: binary
                  description: 头像图片文件（JPG/PNG/WebP/GIF，最大 2 MB）
      responses:
        '200':
          description: 上传并更新后的会员资料（AppResult 信封）
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/AppResult'
                - type: object
                  properties:
                    data:
                      $ref: '#/components/schemas/MemberProfile'
                  required:
                  - data
        '400': *id007
        '401': *id008
        '413':
          description: 头像文件超过 2 MB（40005）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResult'
        '415':
          description: 非法或不支持的图片格式（40006）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResult'
        '500': *id009
        '503': *id010
  /app/member/subscribe:
    post:
      operationId: subscribeMemberMessage
      summary: 上报会员级微信订阅消息授权（累计额度）
      description: 小程序在「我的 → 消费小票通知」、充值提交或已勾选「总是保持以上选择」后的高频点击静默补次数时调用；后端校验已配置模板并累加 cosen_member_subscribe_quota，供代客下单或跨订单发送消费成功通知（电子小票）使用。
      tags:
      - app/会员
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MemberSubscribeReq'
            examples:
              memberCenter:
                summary: 我的页开启或静默补次数上报
                value:
                  templateIds:
                  - vthz1xPTdirSdCFKxFmNPraN-ZQ1FLMc2blSJdUDqHQ
