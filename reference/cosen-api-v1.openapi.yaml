          - discount
          - gift
          maxLength: 16
          description: cash 满减 / discount 折扣 / gift 兑换
        valueCent:
          type: integer
          format: int64
          description: cash/gift 面额（分）；discount 时为 NULL（bigint，单位：分/计数）
        discountRate:
          type: number
          format: double
          description: 折扣率，如 0.8500（仅 discount）
        thresholdCent:
          type: integer
          format: int64
          description: 门槛（分），0 无门槛（bigint，单位：分/计数）
        maxOffCent:
          type: integer
          format: int64
          description: 折扣券最高减（分）（bigint，单位：分/计数）
        issuer:
          type: string
          maxLength: 64
          description: 发放人/店
        reason:
          type: string
          maxLength: 255
          description: 发放理由
        startAt:
          type: string
          format: date-time
          description: 生效时间
        endAt:
          type: string
          format: date-time
          description: 失效时间
        status:
          type: string
          enum:
          - unused
          - used
          - expired
          - transferred
          - frozen
          maxLength: 16
          description: unused/used/expired/transferred/frozen
        usedAt:
          type: string
          format: date-time
          description: 核销时间
        orderId:
          type: string
          format: int64
          description: 核销订单ID（bigint ID，JSON 用字符串避免精度丢失）
        source:
          type: string
          enum:
          - grant
          - redeem
          - transfer
          maxLength: 16
          description: grant 后台发放 / redeem 兑换 / transfer 好友转赠
        fromMemberId:
          type: string
          format: int64
          description: 转赠来源会员ID（bigint ID，JSON 用字符串避免精度丢失）
        transferNo:
          type: string
          maxLength: 40
          description: 转赠单号
        transferAt:
          type: string
          format: date-time
          description: 转出时间
        acceptAt:
          type: string
          format: date-time
          description: 接收时间
        version:
          type: integer
          format: int32
          description: 乐观锁（防重复核销/重复转赠）
        createTime:
          type: string
          format: date-time
          description: 创建时间
          readOnly: true
        updateTime:
          type: string
          format: date-time
          description: 更新时间
          readOnly: true
      x-table: cosen_coupon_user
      required:
      - couponNo
      - memberId
      - title
      - type
      - startAt
      - endAt
    Order:
      type: object
