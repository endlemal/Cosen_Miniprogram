          format: int64
          description: 会员ID（bigint ID，JSON 用字符串避免精度丢失）
        storeId:
          type: string
          format: int64
          description: 门店ID（bigint ID，JSON 用字符串避免精度丢失）
        fulfillType:
          type: string
          enum:
          - pickup
          maxLength: 16
          description: 履约方式：仅 pickup（外送域已剔除）
        itemCount:
          type: integer
          format: int32
          description: 商品件数
        subtotalCent:
          type: integer
          format: int64
          description: 商品小计（分）（bigint，单位：分/计数）
        couponOffCent:
          type: integer
          format: int64
          description: 券抵扣（分）（bigint，单位：分/计数）
        payableCent:
          type: integer
          format: int64
          description: 应付 = 小计 - 券抵扣（分）（bigint，单位：分/计数）
        balancePayCent:
          type: integer
          format: int64
          description: 储值支付（分）（bigint，单位：分/计数）
        wechatPayCent:
          type: integer
          format: int64
          description: 微信支付（分）（bigint，单位：分/计数）
        couponId:
          type: string
          format: int64
          description: 使用的用户券ID（bigint ID，JSON 用字符串避免精度丢失）
        payMode:
          type: string
          enum:
          - balance
          - wechat
          - mixed
          maxLength: 16
          description: balance/wechat/mixed
        payStatus:
          type: string
          enum:
          - unpaid
          - paid
          - refunded
          - closed
          maxLength: 16
          description: unpaid/paid/refunded/closed
        orderStatus:
          type: string
          enum:
          - created
          - paid
          - making
          - ready
          - completed
          - cancelled
          maxLength: 16
          description: created/paid/making/ready/completed/cancelled
        remark:
          type: string
          maxLength: 255
