                tierCode:
                  type: string
                  maxLength: 32
                  description: 档位编码，如 TIER_500_100
                payMode:
                  type: string
                  enum:
                  - wechat
                  default: wechat
                  description: 第一切片固定 wechat（储值余额不能给自己充值）
