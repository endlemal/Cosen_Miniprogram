      description: '创建储值充值单并拉起微信支付。金额单位分；档位按 tierCode 由服务端校验，不信任前端金额。

        幂等：Header Idempotency-Key 必填；同 key 同 payload 重放返回 HTTP 200 + 原充值单（不新增单据、不用 40925）；同 key 不同 payload 返回 40007。

        充值成功触发会员等级重算（累计实充只计本金，满 2000 元升级深焙）。

