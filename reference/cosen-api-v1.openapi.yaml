        游客仅可不用券的普通微信支付；用券、余额或组合支付需已验证手机号，否则 HTTP 403/code 40310。

        真实微信/组合支付返回 wechatPayParams 供 wx.requestPayment；预支付不等于 paid，应查询最终状态。同一共享会员已有预支付须由原付款微信继续；已有预支付按订单和付款 openid 检查/复用，本接口不接受客户端幂等键。

