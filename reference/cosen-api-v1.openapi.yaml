        paidAt:
          type: string
          format: date-time
          description: 支付完成时间
        finishedAt:
          type: string
          format: date-time
          description: 完成/取餐时间
        cancelledAt:
          type: string
          format: date-time
          description: 取消时间
        version:
          type: integer
          format: int32
          description: 乐观锁（状态机）
        createTime:
          type: string
          format: date-time
          description: 创建时间
          readOnly: true
        updateTime:
          type: string
          format: date-time
          description: 更新时间
          readOnly: true
      x-table: cosen_order
      required:
      - orderNo
      - memberId
    OrderItem:
      type: object
      title: OrderItem
      description: 对应表 cosen_order_item（订单明细）
      properties:
        id:
          type: string
          format: int64
          description: 明细ID（bigint ID，JSON 用字符串避免精度丢失）
          readOnly: true
        orderId:
          type: string
          format: int64
          description: 订单ID（bigint ID，JSON 用字符串避免精度丢失）
        productId:
          type: string
          format: int64
          description: 商品ID（bigint ID，JSON 用字符串避免精度丢失）
        productCode:
          type: string
          maxLength: 32
          description: 商品编码快照（m1…）
        productName:
          type: string
          maxLength: 64
          description: 商品名快照
        productNameEn:
          type: string
          maxLength: 64
          description: 英文名快照
        specText:
          type: string
          maxLength: 255
          description: 规格文案快照（大杯 / 少冰 / 少甜）
        specJson:
          type: object
          additionalProperties: true
          description: 规格选择快照（key -> option）（JSON 对象/数组，按原结构透传）
        unitPriceCent:
          type: integer
          format: int64
          description: 成交单价（分，含加料）（bigint，单位：分/计数）
        qty:
          type: integer
          format: int32
          description: 数量
        amountCent:
          type: integer
          format: int64
          description: 小计 = 单价 * 数量（分）（bigint，单位：分/计数）
        artJson:
          type: object
          additionalProperties: true
          description: 插画快照（列表免二次查询）（JSON 对象/数组，按原结构透传）
        createTime:
          type: string
          format: date-time
          description: 创建时间
          readOnly: true
      x-table: cosen_order_item
      required:
      - orderId
      - productId
      - productName
    AppResult:
      type: object
      title: AppResult
      description: 小程序端统一响应信封：code=200 成功
      properties:
        code:
          type: integer
          format: int32
          example: 200
        msg:
          type: string
          example: ok
        data:
          type: object
          additionalProperties: true
      required:
      - code
      - msg
    PageResult:
      type: object
      title: PageResult
