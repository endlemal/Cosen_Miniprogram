      tags:
      - app/订单
      description: '仅本人订单可操作。payStatus 必须为 paid，orderStatus 为 paid/making/ready/completed 时进入 refund_pending，

        仅表示已提交申请，非退款已完成；退款审批与执行不属于本接口。

