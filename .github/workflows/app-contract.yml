name: Mini-program API contract

on:
  push:
    paths:
      - 'reference/cosen-api-v1.openapi.yaml'
      - 'reference/requirements-contract.txt'
      - 'scripts/check-app-contract.py'
      - 'src/api/**'
      - 'src/**/*.vue'
      - '.github/workflows/app-contract.yml'
  pull_request:
    paths:
      - 'reference/cosen-api-v1.openapi.yaml'
      - 'reference/requirements-contract.txt'
      - 'scripts/check-app-contract.py'
      - 'src/api/**'
      - 'src/**/*.vue'
      - '.github/workflows/app-contract.yml'

permissions:
  contents: read

jobs:
  offline-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: reference/requirements-contract.txt
      - run: python -m pip install -r reference/requirements-contract.txt
      - run: python scripts/check-app-contract.py
